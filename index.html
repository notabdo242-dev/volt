      draftQuizEditorState.titleAr = document.getElementById('qzTitleAr').value;
      draftQuizEditorState.grade = Number(document.getElementById('qzGrade').value);
      draftQuizEditorState.lessonId = document.getElementById('qzLessonId').value;
      draftQuizEditorState.passingPercentage = Number(document.getElementById('qzPassPct').value);
      draftQuizEditorState.allowReview = document.getElementById('qzAllowReview').checked;
      draftQuizEditorState.descriptionEn = document.getElementById('qzDescEn').value;
      draftQuizEditorState.descriptionAr = document.getElementById('qzDescAr').value;

        const tAr = document.getElementById(`qTextAr_${idx}`);

        if (tAr) q.textAr = tAr.value;

    function saveQuizFromModal() {
      const user = AppState.currentUser;
      syncDraftQuizFromDom();
      const qz = draftQuizEditorState;
      const errBox = document.getElementById('quizFormError');

      const finalTitleEn = (qz.titleEn || qz.titleAr || '').trim();
      const finalTitleAr = (qz.titleAr || qz.titleEn || '').trim();
      const passPct = Number(qz.passingPercentage);

      if (!finalTitleEn || isNaN(passPct) || passPct < 1 || passPct > 100 || !Array.isArray(qz.questions) || qz.questions.length === 0) {
        errBox.textContent = t('validationFailed');
        errBox.classList.remove('hidden');
        return;
      }

      const cleanedQuestions = [];
      for (let i = 0; i < qz.questions.length; i++) {
        const q = qz.questions[i];
        const qEn = (q.textEn || q.textAr || '').trim();
        const qAr = (q.textAr || q.textEn || '').trim();
        const pts = Number(q.points);
        const corr = Number(q.correctIndex);

        if (!qEn || isNaN(pts) || pts <= 0 || ![0, 1, 2, 3].includes(corr)) {
          errBox.textContent = `${t('validationFailed')} (#${i + 1})`;
          errBox.classList.remove('hidden');
          return;
        }

        const cEnList = [];
        const cArList = [];
        for (let c = 0; c < 4; c++) {
          const valEn = ((q.choicesEn && q.choicesEn[c]) || (q.choicesAr && q.choicesAr[c]) || '').trim();
          const valAr = ((q.choicesAr && q.choicesAr[c]) || (q.choicesEn && q.choicesEn[c]) || '').trim();
          if (!valEn) {
            errBox.textContent = `${t('validationFailed')} (#${i + 1} - ${t('choiceLabel')} ${c + 1})`;
            errBox.classList.remove('hidden');
            return;
          }
          cEnList.push(valEn);
          cArList.push(valAr);
        }

        cleanedQuestions.push({
          id: q.id || (`q_${Date.now()}_${i}`),
          textEn: qEn,
          textAr: qAr,
          choicesEn: cEnList,
          choicesAr: cArList,
          correctIndex: corr,
          points: pts
        });
      }

      const nowIso = new Date().toISOString();
      let existingQuiz = null;
      if (qz.id) {
        existingQuiz = StorageService.findById(STORAGE_KEYS.QUIZZES, qz.id);
        if (!PermissionService.canModifyRecord(user, existingQuiz)) {
          showToast(t('unauthorizedAccess'), 'error');
          return;
        }
      }

      const payload = {
        id: qz.id || ('quiz_' + Date.now()),
        grade: [7, 8, 9].includes(Number(qz.grade)) ? Number(qz.grade) : 7,
        lessonId: qz.lessonId || '',
        titleEn: finalTitleEn,
        titleAr: finalTitleAr,
        descriptionEn: (qz.descriptionEn || qz.descriptionAr || finalTitleEn).trim(),
        descriptionAr: (qz.descriptionAr || qz.descriptionEn || finalTitleAr).trim(),
        passingPercentage: passPct,
        allowReview: Boolean(qz.allowReview),
        status: existingQuiz ? (existingQuiz.status || 'published') : 'published',
        createdBy: existingQuiz ? existingQuiz.createdBy : user.id,
        updatedBy: user.id,
        createdAt: existingQuiz ? existingQuiz.createdAt : nowIso,
        updatedAt: nowIso,
        questions: cleanedQuestions
      };

      if (qz.id) {
        StorageService.updateRecord(STORAGE_KEYS.QUIZZES, qz.id, payload);
        EduSyncEngine.broadcastQuizUpdate(payload, user);
      } else {
        StorageService.addRecord(STORAGE_KEYS.QUIZZES, payload);
        StorageService.logActivity({
          actorId: user.id,
          actionType: 'quiz_created',
          relatedId: payload.id,
          descriptionEn: `${user.nameEn} created quiz "${payload.titleEn}".`,
          descriptionAr: `قام ${user.nameAr} بإنشاء اختبار "${payload.titleAr}".`
        });
      }

      const recipientIds = resolveSelectedRecipientStudentIds(user.id, payload.grade);
      if (recipientIds.length > 0) {
        assignQuizToStudents(payload, user, recipientIds, '');
      }

      draftQuizEditorState = null;
      closeModal();
      showToast(t('savedSuccess'), 'success');
      renderApp();
    }

                            ${att ? `
                              <button type="button" class="btn btn-sm btn-outline" data-action="inspect-attempt" data-id="${escapeHtml(att.id)}">
                                🔍 ${escapeHtml(t('inspectAnswers'))}
                              </button>
                            ` : '—'}
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>`
            }
          </div>
        </div>
      `;
    }

    function computeQuizAssignmentStatus(qa, latestAttempt) {
      if (latestAttempt || qa.status === 'submitted') return 'submitted';
      if (qa.status === 'started') return 'started';
      if (qa.dueDate) {
        const dueTime = new Date(qa.dueDate + 'T23:59:59').getTime();
        if (!isNaN(dueTime) && Date.now() > dueTime) return 'overdue';
      }
      return 'assigned';
    }

    function renderQuizAssignmentStatusBadge(status) {
      if (status === 'submitted') return `<span class="badge badge-pass">✓ ${escapeHtml(t('statusSubmitted'))}</span>`;
      if (status === 'started') return `<span class="badge badge-amber">⏳ ${escapeHtml(t('statusStarted'))}</span>`;
      if (status === 'overdue') return `<span class="badge badge-fail">⚠️ ${escapeHtml(t('statusOverdue'))}</span>`;
      return `<span class="badge badge-primary">✨ ${escapeHtml(t('statusAssigned'))}</span>`;
    }

    /* =========================================================================
       11. QUIZ-TAKING INTERFACE & 12. SCORING AND ATTEMPT HISTORY
       ========================================================================= */
    function getStudentAuthorizedQuizzes(studentUser) {
      const allQuizzes = StorageService.readData(STORAGE_KEYS.QUIZZES, []);
      const assignments = StorageService.filterAssignmentsByStudent(STORAGE_KEYS.QUIZ_ASSIGNMENTS, studentUser.id);
      const assignedMap = new Map();
      assignments.forEach(qa => {
        if (qa && qa.quizId) assignedMap.set(qa.quizId, qa);
      });

      return allQuizzes
        .filter(q => q && q.status !== 'draft' && assignedMap.has(q.id))
        .map(q => ({
          quiz: q,
          assignment: assignedMap.get(q.id)
        }));
    }

    function renderStudentQuizzes() {
      const user = AppState.currentUser;
      const authorized = getStudentAuthorizedQuizzes(user);
      const lessons = StorageService.readData(STORAGE_KEYS.LESSONS, []);
      const attempts = StorageService.readData(STORAGE_KEYS.ATTEMPTS, []).filter(
        a => a && a.studentId === user.id
      );
      const statusFilter = AppState.filters.studentQuizStatusFilter || 'all';

      const enriched = authorized.map(({ quiz, assignment }) => {
        const myAttempts = attempts.filter(a => a.quizId === quiz.id)
          .sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));
        const latestAtt = myAttempts[0] || null;
        const effectiveStatus = computeQuizAssignmentStatus(assignment, latestAtt);
        return { quiz, assignment, myAttempts, latestAtt, effectiveStatus };
      }).filter(item => statusFilter === 'all' || item.effectiveStatus === statusFilter);

      return `
        <div class="filter-bar">
          <div style="display: flex; gap: 0.45rem; flex-wrap: wrap;">
            ${[
              { k: 'all', label: t('allStatuses') },
              { k: 'assigned', label: t('statusAssigned') },
              { k: 'started', label: t('statusStarted') },
              { k: 'submitted', label: t('statusSubmitted') },
              { k: 'overdue', label: t('statusOverdue') }
            ].map(tab => `
              <button
                type="button"
                class="btn btn-sm ${statusFilter === tab.k ? 'btn-primary' : 'btn-outline'}"
                data-action="filter-student-quizzes"
                data-status="${tab.k}"
              >${escapeHtml(tab.label)}</button>
            `).join('')}
          </div>
        </div>

        ${enriched.length === 0
          ? `<div class="card"><div class="empty-state"><h4>${escapeHtml(t('noAttemptsYet'))}</h4></div></div>`
          : `<div class="grid-3">
              ${enriched.map(({ quiz, assignment, myAttempts, latestAtt, effectiveStatus }) => {
                const lesson = lessons.find(l => l.id === quiz.lessonId);
                const teacher = StorageService.findById(STORAGE_KEYS.USERS, quiz.createdBy);
                const bestPct = myAttempts.length > 0
                  ? Math.max(...myAttempts.map(a => Number(a.percentage) || 0))
                  : null;
                const totalPts = calculateQuizTotalPoints(quiz);

                return `
                  <article class="lesson-card">
                    <div class="lesson-thumb grade-${quiz.grade}">
                      <div class="lesson-thumb-top">
                        <span class="badge badge-grade-${quiz.grade}">${escapeHtml(formatGradeLabel(quiz.grade, true))}</span>
                        <span class="badge" style="background: rgba(255,255,255,0.2); color: #fff;">
                          ${quiz.questions.length} ${escapeHtml(t('questionsCount'))} • ${totalPts} ${escapeHtml(t('pointsLabel'))}
                        </span>
                      </div>
                      <div>
                        <div class="lesson-thumb-unit">${lesson ? escapeHtml(locText(lesson, 'title')) : ''}</div>
                        <h3 class="lesson-thumb-title">${escapeHtml(locText(quiz, 'title'))}</h3>
                      </div>
                    </div>
                    <div class="lesson-card-body">
                      <div>
                        <p class="lesson-desc">${escapeHtml(locText(quiz, 'description'))}</p>
                        <div class="lesson-meta-row" style="margin-top: 0.65rem;">
                          <span>👨‍🏫 ${escapeHtml(teacher ? locText(teacher, 'name') : '')}</span>
                          <span>• 📅 ${escapeHtml(formatDate(assignment.assignedAt))}</span>
                          ${assignment.dueDate ? `<span>• ⏰ ${escapeHtml(t('colDueDate'))}: ${escapeHtml(assignment.dueDate)}</span>` : ''}
                        </div>
                        <div class="lesson-meta-row" style="margin-top: 0.55rem;">
                          ${renderQuizAssignmentStatusBadge(effectiveStatus)}
                          <span class="badge badge-primary">🎯 ${escapeHtml(t('passingPercentage'))}: ${quiz.passingPercentage}%</span>
                          ${bestPct !== null ? `
                            <span class="badge ${bestPct >= quiz.passingPercentage ? 'badge-pass' : 'badge-fail'}">
                              🏅 ${escapeHtml(t('bestScoreLabel'))}: ${bestPct}%
                            </span>
                          ` : ''}
                        </div>
                      </div>
                      <div class="lesson-actions">
                        <button type="button" class="btn btn-primary btn-sm" data-action="start-quiz" data-id="${escapeHtml(quiz.id)}">
                          ✍️ ${escapeHtml(effectiveStatus === 'started' ? t('continueQuiz') : (myAttempts.length > 0 ? t('retakeQuiz') : t('startQuiz')))}
                        </button>
                        ${latestAtt ? `
                          <button type="button" class="btn btn-outline btn-sm" data-action="inspect-attempt" data-id="${escapeHtml(latestAtt.id)}">
                            🔍 ${escapeHtml(t('viewResultBtn'))}
                          </button>

                      </div>
                    </div>
                  </article>
                `;
              }).join('')}
            </div>`

    function startStudentQuiz(quizId) {
      const user = AppState.currentUser;
      const quiz = StorageService.findById(STORAGE_KEYS.QUIZZES, quizId);
      if (!quiz || !Array.isArray(quiz.questions) || quiz.questions.length === 0) return;

      const assignments = StorageService.filterAssignmentsByStudent(STORAGE_KEYS.QUIZ_ASSIGNMENTS, user.id);
      const matchedAssign = assignments.find(a => a && a.quizId === quiz.id);
      if (matchedAssign && matchedAssign.status === 'assigned') {
        StorageService.updateRecord(STORAGE_KEYS.QUIZ_ASSIGNMENTS, matchedAssign.id, {
          ...matchedAssign,
          status: 'started',
          updatedAt: new Date().toISOString()
        });
      }

      AppState.activeQuizSession = {
        quizId: quiz.id,
        assignmentId: matchedAssign ? matchedAssign.id : '',
        currentIndex: 0,
        viewMode: 'single',
        selectedAnswers: new Array(quiz.questions.length).fill(null),
        submittedResult: null
      };
      AppState.currentPage = 'student-quizzes';
      renderApp();
    }

    function requestSubmitQuiz() {
      const session = AppState.activeQuizSession;
      if (!session || session.submittedResult) return;
      const quiz = StorageService.findById(STORAGE_KEYS.QUIZZES, session.quizId);
      if (!quiz) return;

      const unansweredCount = session.selectedAnswers.filter(v => v === null || v === undefined).length;
      const banner = document.getElementById('quizValidationBanner');
      if (unansweredCount > 0) {
        if (banner) {
          banner.textContent = t('unansweredWarning', { count: unansweredCount });
          banner.classList.remove('hidden');
        }
        return;
      }

      openConfirmDialog(t('submitConfirmTitle'), t('submitConfirmText'), () => {
        finalizeQuizSubmission(quiz, session);
      });
    }

    function finalizeQuizSubmission(quiz, session) {
      if (session.submittedResult) return;
      const student = AppState.currentUser;

      let scoreEarned = 0;
      let maxScore = 0;

      quiz.questions.forEach((q, idx) => {
        const pts = Math.max(0, Number(q.points) || 1);
        maxScore += pts;
        if (Number(session.selectedAnswers[idx]) === Number(q.correctIndex)) {
          scoreEarned += pts;
        }
      });

      const percentage = maxScore > 0 ? Math.round((scoreEarned / maxScore) * 100) : 0;
      const passed = percentage >= (Number(quiz.passingPercentage) || 60);
      const nowIso = new Date().toISOString();

      const assignments = StorageService.filterAssignmentsByStudent(STORAGE_KEYS.QUIZ_ASSIGNMENTS, student.id);
      const matchedAssign = assignments.find(a => a && a.quizId === quiz.id);

      const attemptRecord = {
        id: 'att_' + Date.now(),
        studentId: student.id,
        quizId: quiz.id,
        assignmentId: matchedAssign ? matchedAssign.id : '',
        teacherId: quiz.createdBy || (matchedAssign ? matchedAssign.teacherId : ''),
        selectedAnswers: [...session.selectedAnswers],
        scoreEarned,
        maxScore,
        percentage,
        passed,
        submittedAt: nowIso
      };

      StorageService.addRecord(STORAGE_KEYS.ATTEMPTS, attemptRecord);

      if (matchedAssign) {
        StorageService.updateRecord(STORAGE_KEYS.QUIZ_ASSIGNMENTS, matchedAssign.id, {
          ...matchedAssign,
          status: 'submitted',
          updatedAt: nowIso
        });
      }

      if (passed && quiz.lessonId) {
        const settings = StorageService.readData(STORAGE_KEYS.SETTINGS, {});
        if (!settings.completedLessonsByStudent) settings.completedLessonsByStudent = {};
        const list = Array.isArray(settings.completedLessonsByStudent[student.id])
          ? settings.completedLessonsByStudent[student.id]
          : [];
        if (!list.includes(quiz.lessonId)) {
          settings.completedLessonsByStudent[student.id] = [...list, quiz.lessonId];
          StorageService.saveData(STORAGE_KEYS.SETTINGS, settings);
        }
      }

      // Notify teacher
      if (attemptRecord.teacherId) {
        StorageService.createNotification({
          recipientId: attemptRecord.teacherId,
          titleEn: `Quiz Submitted: ${student.nameEn} (${percentage}%)`,
          titleAr: `تسليم اختبار: ${student.nameAr} (${percentage}%)`,
          messageEn: `${student.nameEn} completed "${quiz.titleEn}" with ${scoreEarned}/${maxScore} (${percentage}% - ${passed ? 'Passed' : 'Failed'}).`,
          messageAr: `أكمل الطالب ${student.nameAr} "${quiz.titleAr}" بنتيجة ${scoreEarned}/${maxScore} (${percentage}%).`,
          relatedId: attemptRecord.id
        });
      }

      // Notify student of result
      StorageService.createNotification({
        recipientId: student.id,
        titleEn: `Result Available: ${quiz.titleEn} (${percentage}%)`,
        titleAr: `النتيجة متاحة: ${quiz.titleAr} (${percentage}%)`,
        messageEn: `You scored ${scoreEarned}/${maxScore} (${percentage}%) on "${quiz.titleEn}".`,
        messageAr: `حصلت على ${scoreEarned}/${maxScore} (${percentage}%) في "${quiz.titleAr}".`,
        relatedId: attemptRecord.id
      });

      StorageService.logActivity({
        actorId: student.id,
        actionType: 'quiz_submitted',
        relatedId: attemptRecord.id,
        descriptionEn: `${student.nameEn} submitted quiz "${quiz.titleEn}" (${percentage}%).`,
        descriptionAr: `قام ${student.nameAr} بتسليم اختبار "${quiz.titleAr}" (${percentage}%).`
      });

      EduSyncEngine.broadcastQuizSubmission(attemptRecord, quiz, student);
      session.submittedResult = attemptRecord;
      showToast(t('quizSubmittedToast'), passed ? 'success' : 'warning');
      renderApp();
    }

            <span class="badge badge-primary">${attempt.scoreEarned} / ${attempt.maxScore} (${attempt.percentage}%)</span>

        const avgScore = stAttempts.length > 0
          ? Math.round(stAttempts.reduce((s, a) => s + (Number(a.percentage) || 0), 0) / stAttempts.length)

    function saveManualStudentFromModal() {
      const teacher = AppState.currentUser;
      const fullName = document.getElementById('msFullName').value.trim();
      const username = document.getElementById('msUsername').value.trim().toLowerCase();
      const grade = Number(document.getElementById('msGrade').value);
      const password = document.getElementById('msPassword').value.trim() || '123456';
      const errBox = document.getElementById('manualStudentError');

      if (!fullName || !username || ![7, 8, 9].includes(grade)) {
        errBox.textContent = t('validationFailed');
        errBox.classList.remove('hidden');
        return;
      }

      const users = StorageService.readData(STORAGE_KEYS.USERS, []);
      if (users.some(u => u && String(u.username || '').toLowerCase() === username)) {
        errBox.textContent = t('usernameTaken');
        errBox.classList.remove('hidden');
        return;
      }

      const nowIso = new Date().toISOString();
      const studentId = 'u_student_' + Date.now();
      const newStudent = {
        id: studentId,
        username,
        email: '',
        password,
        role: 'student',
        grade,
        studentCode: generateUniqueCode('STU'),
        nameEn: fullName,
        nameAr: fullName,
        createdAt: nowIso,
        updatedAt: nowIso
      };

      StorageService.addRecord(STORAGE_KEYS.USERS, newStudent);
      StorageService.addRecord(STORAGE_KEYS.CONNECTIONS, {
        id: 'conn_' + Date.now(),
        teacherId: teacher.id,
        studentId,
        status: 'approved',
        createdAt: nowIso,
        updatedAt: nowIso
      });

      StorageService.logActivity({
        actorId: teacher.id,
        actionType: 'student_added_manually',
        relatedId: studentId,
        descriptionEn: `${teacher.nameEn} manually added and connected student ${fullName} (@${username}).`,
        descriptionAr: `قام ${teacher.nameAr} بإضافة وربط الطالب ${fullName} (@${username}).`
      });

      closeModal();
      showToast(t('savedSuccess'), 'success');
      renderApp();
    }

    function renderTeacherReports() {
      const user = AppState.currentUser;
      const connectedStudents = StorageService.getConnectedStudentsForTeacher(user.id, 'approved');
      const quizzes = StorageService.filterByOwner(STORAGE_KEYS.QUIZZES, user.id);
      const attempts = StorageService.readData(STORAGE_KEYS.ATTEMPTS, []);

      return `
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">📈 ${escapeHtml(t('navTeacherReports'))}</h2>
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>${escapeHtml(t('colQuiz'))}</th>
                  <th>${escapeHtml(t('colGrade'))}</th>
                  <th>${escapeHtml(t('colAvgScore'))}</th>
                  <th>${escapeHtml(t('passed'))}</th>
                  <th>${escapeHtml(t('failed'))}</th>
                  <th>${escapeHtml(t('notAttempted'))}</th>
                </tr>
              </thead>
              <tbody>
                ${quizzes.map(qz => {
                  const gradeStudents = connectedStudents.filter(s => Number(s.grade) === Number(qz.grade));
                  const qAttempts = attempts.filter(a => a && a.quizId === qz.id);
                  const avg = qAttempts.length > 0
                    ? Math.round(qAttempts.reduce((s, a) => s + (Number(a.percentage) || 0), 0) / qAttempts.length)
                    : 0;

                  const passedNames = [];
                  const failedNames = [];
                  const notAttemptedNames = [];

                  gradeStudents.forEach(st => {
                    const stAtts = qAttempts.filter(a => a.studentId === st.id);
                    if (stAtts.length === 0) {
                      notAttemptedNames.push(locText(st, 'name'));
                    } else if (stAtts.some(a => a.passed)) {
                      passedNames.push(locText(st, 'name'));
                    } else {
                      failedNames.push(locText(st, 'name'));
                    }
                  });

                  return `
                    <tr>
                      <td><strong>${escapeHtml(locText(qz, 'title'))}</strong></td>
                      <td><span class="badge badge-grade-${qz.grade}">${escapeHtml(formatGradeLabel(qz.grade, true))}</span></td>
                      <td><strong>${avg}%</strong> (${qAttempts.length} ${escapeHtml(t('colAttempts'))})</td>
                      <td>
                        <span class="badge badge-pass">${passedNames.length}</span>
                        <div style="font-size: 0.78rem; color: var(--text-secondary); margin-top: 0.2rem;">${escapeHtml(passedNames.join(', ') || '—')}</div>
                      </td>
                      <td>
                        <span class="badge badge-fail">${failedNames.length}</span>
                        <div style="font-size: 0.78rem; color: var(--text-secondary); margin-top: 0.2rem;">${escapeHtml(failedNames.join(', ') || '—')}</div>
                      </td>
                      <td>
                        <span class="badge badge-neutral">${notAttemptedNames.length}</span>
                        <div style="font-size: 0.78rem; color: var(--text-secondary); margin-top: 0.2rem;">${escapeHtml(notAttemptedNames.join(', ') || '—')}</div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderTeacherAttempts() {
      const user = AppState.currentUser;
      const myQuizzes = StorageService.filterByOwner(STORAGE_KEYS.QUIZZES, user.id);
      const myQuizIds = new Set(myQuizzes.map(q => q.id));
      const attempts = StorageService.readData(STORAGE_KEYS.ATTEMPTS, [])
        .filter(a => a && (a.teacherId === user.id || myQuizIds.has(a.quizId)))
        .sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));
      const users = StorageService.readData(STORAGE_KEYS.USERS, []);
      const f = AppState.filters;

      const filtered = attempts.filter(att => {
        const st = users.find(u => u && u.id === att.studentId);
        if (f.attemptGrade !== 'all' && (!st || Number(st.grade) !== Number(f.attemptGrade))) return false;
        if (f.attemptQuiz !== 'all' && att.quizId !== f.attemptQuiz) return false;
        if (f.attemptStatus === 'passed' && !att.passed) return false;
        if (f.attemptStatus === 'failed' && att.passed) return false;

              <option value="8" ${f.attemptGrade === '8' ? 'selected' : ''}>${escapeHtml(t('grade8Short'))}</option>

              ${myQuizzes.map(q => `<option value="${escapeHtml(q.id)}" ${f.attemptQuiz === q.id ? 'selected' : ''}>${escapeHtml(locText(q, 'title'))}</option>`).join('')}

              : `<table class="data-table">
                  <thead>
                    <tr>
                      <th>${escapeHtml(t('colStudentName'))}</th>
                      <th>${escapeHtml(t('colGrade'))}</th>
                      <th>${escapeHtml(t('colQuiz'))}</th>
                      <th>${escapeHtml(t('colScore'))}</th>
                      <th>${escapeHtml(t('colPercentage'))}</th>
                      <th>${escapeHtml(t('colStatus'))}</th>
                      <th>${escapeHtml(t('colDate'))}</th>
                      <th>${escapeHtml(t('colActions'))}</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${filtered.map(att => {
                      const st = users.find(u => u && u.id === att.studentId);
                      const qz = myQuizzes.find(q => q && q.id === att.quizId);
                      return `
                        <tr>
                          <td><strong>${st ? escapeHtml(locText(st, 'name')) : att.studentId}</strong></td>

    function handleStudentRequestConnection() {
      const student = AppState.currentUser;
      const inputEl = document.getElementById('studentConnectCodeInput');
      const errBox = document.getElementById('studentConnectError');
      const code = String(inputEl ? inputEl.value : '').trim().toUpperCase();

      if (!code || (student.studentCode && code === String(student.studentCode).toUpperCase())) {
        errBox.textContent = t('invalidConnectCode');
        errBox.classList.remove('hidden');
        return;
      }

      const users = StorageService.readData(STORAGE_KEYS.USERS, []);
      const teachers = users.filter(u => u && u.role === 'teacher');
      let targetTeacher = teachers.find(
        tc => String(tc.teacherCode || '').toUpperCase() === code || String(tc.username || '').toUpperCase() === code
      );
      let matchedInvite = null;

      if (!targetTeacher) {
        const invites = StorageService.readData(STORAGE_KEYS.INVITATIONS, []);
        matchedInvite = invites.find(inv => inv && String(inv.code || '').toUpperCase() === code && inv.status === 'active');
        if (matchedInvite) {
          targetTeacher = teachers.find(tc => tc.id === matchedInvite.teacherId);
        }
      }

      // Allow cross-device teacher connection by valid TCH-* code format even before teacher directory packet arrives
      const isValidRemoteTeacherCode = /^TCH-[A-Z0-9-]+$/i.test(code);
      if (!targetTeacher && !isValidRemoteTeacherCode) {
        errBox.textContent = t('invalidConnectCode');
        errBox.classList.remove('hidden');
        return;
      }

      if (targetTeacher && targetTeacher.id === student.id) {
        errBox.textContent = t('invalidConnectCode');
        errBox.classList.remove('hidden');
        return;
      }

      const resolvedTeacherId = targetTeacher ? targetTeacher.id : `remote_teacher_${code}`;
      const resolvedTeacherCode = targetTeacher ? String(targetTeacher.teacherCode || code).toUpperCase() : code;

      const existingConns = StorageService.readData(STORAGE_KEYS.CONNECTIONS, []);
      const dup = existingConns.find(
        c => c && c.studentId === student.id &&
          (c.teacherId === resolvedTeacherId || (c.teacherCode && String(c.teacherCode).toUpperCase() === resolvedTeacherCode)) &&
          c.status !== 'rejected'
      );
      if (dup) {
        errBox.textContent = t('alreadyConnectedMsg');
        errBox.classList.remove('hidden');
        return;
      }

      const nowIso = new Date().toISOString();
      const isAutoApproved = Boolean(matchedInvite);
      const newConn = {
        id: `conn_${resolvedTeacherCode}_${student.id}`,
        teacherId: resolvedTeacherId,
        teacherCode: resolvedTeacherCode,
        teacherNameEn: targetTeacher ? targetTeacher.nameEn : `Teacher (${resolvedTeacherCode})`,
        studentId: student.id,
        status: isAutoApproved ? 'approved' : 'pending',
        createdAt: nowIso,
        updatedAt: nowIso
      };
      StorageService.addRecord(STORAGE_KEYS.CONNECTIONS, newConn);
      EduSyncEngine.broadcastConnectionRequest(newConn, student, resolvedTeacherCode, targetTeacher ? targetTeacher.id : '');

      if (matchedInvite) {
        StorageService.updateRecord(STORAGE_KEYS.INVITATIONS, matchedInvite.id, {
          ...matchedInvite,
          status: 'used',
          usedBy: student.id
        });
      }

      StorageService.createNotification({
        recipientId: resolvedTeacherId,
        titleEn: isAutoApproved
          ? `Student Connected via Invite: ${student.nameEn}`
          : `New Connection Request: ${student.nameEn}`,
        titleAr: isAutoApproved

    function renderStudentProgress() {
      const user = AppState.currentUser;

        .filter(a => a && a.studentId === user.id)
        .sort((a, b) => new Date(a.submittedAt) - new Date(b.submittedAt));

      const highestScore = myAttempts.length > 0
        ? Math.max(...myAttempts.map(a => Number(a.percentage) || 0))
        : 0;
      const latestScore = myAttempts.length > 0
        ? myAttempts[myAttempts.length - 1].percentage

    /* =========================================================================
       16. VALIDATION, MODAL DIALOGS, TOASTS & ERROR HANDLING
       ========================================================================= */
    let activeConfirmCallback = null;

    function openModal(title, bodyHtml, footerHtml, sizeClass = '') {
      const container = document.getElementById('modalContainer');
      const dialog = document.getElementById('modalDialog');
      const titleEl = document.getElementById('modalTitle');
      const bodyEl = document.getElementById('modalBody');
      const footerEl = document.getElementById('modalFooter');

      dialog.className = 'modal-dialog ' + (sizeClass || '');
      titleEl.textContent = title;
      bodyEl.innerHTML = bodyHtml;
      footerEl.innerHTML = footerHtml;
      container.classList.remove('hidden');
    }

    function closeModal() {
      const container = document.getElementById('modalContainer');
      container.classList.add('hidden');
      activeConfirmCallback = null;
    }

    function openConfirmDialog(title, message, onConfirm) {
      activeConfirmCallback = onConfirm;
      const bodyHtml = `<p style="font-size: 0.95rem; color: var(--text-secondary);">${escapeHtml(message)}</p>`;
      const footerHtml = `
        <button type="button" class="btn btn-outline" data-action="close-modal">${escapeHtml(t('cancel'))}</button>
        <button type="button" class="btn btn-danger" data-action="confirm-modal-action">${escapeHtml(t('confirm'))}</button>
      `;
      openModal(title, bodyHtml, footerHtml, 'modal-sm');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast-item ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 3600);
    }

    /* =========================================================================
       17. APPLICATION INITIALIZATION & EVENT DELEGATION
       ========================================================================= */
    function renderApp() {
      const root = document.getElementById('appRoot');
      if (!root) return;

      if (!AppState.currentUser) {
        root.innerHTML = renderLoginView();
      } else {
        root.innerHTML = renderWorkspaceShell();
      }
    }

    function attachGlobalEvents() {
      document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

      document.addEventListener('click', (e) => {
        const actionBtn = e.target.closest('[data-action]');
        if (!actionBtn) {
          if (AppState.activeDropdown && !e.target.closest('.dropdown-wrapper')) {
            AppState.activeDropdown = null;
            renderApp();
          }
          return;
        }

        const action = actionBtn.getAttribute('data-action');
        const id = actionBtn.getAttribute('data-id');

        switch (action) {
          case 'toggle-lang':
            setLanguage(AppState.lang === 'en' ? 'ar' : 'en');
            break;

          case 'switch-auth-mode':
            AppState.authMode = actionBtn.getAttribute('data-mode') === 'signup' ? 'signup' : 'signin';
            renderApp();
            break;

          case 'select-signup-role':
            AppState.signupRole = actionBtn.getAttribute('data-role') === 'teacher' ? 'teacher' : 'student';
            renderApp();
            break;

          case 'fill-demo': {
            AppState.authMode = 'signin';
            renderApp();
            const u = actionBtn.getAttribute('data-user');
            const p = actionBtn.getAttribute('data-pass');
            const uInput = document.getElementById('loginUsername');
            const pInput = document.getElementById('loginPassword');
            if (uInput && pInput) {
              uInput.value = u;
              pInput.value = p;
              uInput.focus();
            }
            break;
          }

          case 'toggle-sidebar':
            if (window.innerWidth <= 992) {
              AppState.mobileSidebarOpen = !AppState.mobileSidebarOpen;
            } else {
              AppState.sidebarCollapsed = !AppState.sidebarCollapsed;
            }
            renderApp();
            break;

          case 'close-mobile-sidebar':
            AppState.mobileSidebarOpen = false;
            renderApp();
            break;

          case 'toggle-dropdown': {
            const target = actionBtn.getAttribute('data-dropdown');
            AppState.activeDropdown = AppState.activeDropdown === target ? null : target;
            renderApp();
            break;
          }

          case 'navigate': {
            const page = actionBtn.getAttribute('data-page');
            AppState.activeQuizSession = null;
            navigateTo(page);
            break;
          }

          case 'logout':
            AuthService.logout();
            break;

          case 'confirm-reset-data':
            openConfirmDialog(t('resetConfirmTitle'), t('resetConfirmText'), () => {
              StorageService.initializeDemoData(true);
              closeModal();
              showToast(t('dataResetToast'), 'success');
              renderApp();
            });
            break;

          case 'close-modal':
            closeModal();
            break;

          case 'confirm-modal-action':
            if (typeof activeConfirmCallback === 'function') {
              const fn = activeConfirmCallback;
              closeModal();
              fn();
            }
            break;

          /* Student Management & Connections */
          case 'open-add-student-modal':
            openAddStudentManuallyModal();
            break;

          case 'save-manual-student':
            saveManualStudentFromModal();
            break;

          case 'generate-invite-code': {
            const user = AppState.currentUser;
            if (user && user.role === 'teacher') {
              const newInvite = {
                id: 'inv_' + Date.now(),
                code: generateUniqueCode('INV-SCI'),
                teacherId: user.id,
                grade: 7,
                status: 'active',
                usedBy: null,
                createdAt: new Date().toISOString()
              };
              StorageService.addRecord(STORAGE_KEYS.INVITATIONS, newInvite);
              showToast(`Invite Code Generated: ${newInvite.code}`, 'success');
              renderApp();
            }
            break;
          }

          case 'respond-connection': {
            const nextStatus = actionBtn.getAttribute('data-status');
            const conn = StorageService.findById(STORAGE_KEYS.CONNECTIONS, id);
            const teacher = AppState.currentUser;
            if (conn && teacher && conn.teacherId === teacher.id) {
              const nowIso = new Date().toISOString();
              StorageService.updateRecord(STORAGE_KEYS.CONNECTIONS, conn.id, {
                ...conn,
                status: nextStatus,
                updatedAt: nowIso
              });
              EduSyncEngine.broadcastConnectionDecision(conn, teacher, nextStatus);
              if (nextStatus === 'approved') {
                StorageService.createNotification({
                  recipientId: conn.studentId,
                  titleEn: `Connection Approved by ${teacher.nameEn}`,
                  titleAr: `تم قبول طلب الارتباط بواسطة ${teacher.nameAr}`,
                  messageEn: `${teacher.nameEn} approved your connection request. You can now receive lessons and quizzes.`,
                  messageAr: `وافق ${teacher.nameAr} على طلب ارتباطك. يمكنك الآن استقبال الدروس والاختبارات.`,
                  relatedId: conn.id
                });
                StorageService.logActivity({
                  actorId: teacher.id,
                  actionType: 'connection_approved',
                  relatedId: conn.id,
                  descriptionEn: `${teacher.nameEn} approved student connection (${conn.studentId}).`,
                  descriptionAr: `وافق ${teacher.nameAr} على ارتباط الطالب (${conn.studentId}).`
                });
                showToast(t('connectionApprovedToast'), 'success');
              } else {
                showToast(t('savedSuccess'), 'info');
              }
              renderApp();
            }
            break;
          }

          case 'remove-student-connection': {
            const teacher = AppState.currentUser;
            openConfirmDialog(t('removeStudentTitle'), t('removeStudentText'), () => {
              const conns = StorageService.readData(STORAGE_KEYS.CONNECTIONS, []);
              const target = conns.find(c => c && c.teacherId === teacher.id && c.studentId === id);
              if (target) {
                StorageService.deleteRecord(STORAGE_KEYS.CONNECTIONS, target.id);
                EduSyncEngine.broadcastConnectionDecision(target, teacher, 'removed');
                StorageService.logActivity({
                  actorId: teacher.id,
                  actionType: 'student_removed',
                  relatedId: id,
                  descriptionEn: `${teacher.nameEn} removed student (${id}) from their teaching group.`,
                  descriptionAr: `قام ${teacher.nameAr} بإزالة الطالب (${id}) من مجموعته.`
                });
              }
              showToast(t('deletedSuccess'), 'success');
              renderApp();
            });
            break;
          }

          case 'student-request-connection':
            handleStudentRequestConnection();
            break;

          case 'cancel-connection-request': {
            const conn = StorageService.findById(STORAGE_KEYS.CONNECTIONS, id);
            if (conn && AppState.currentUser && conn.studentId === AppState.currentUser.id) {
              StorageService.deleteRecord(STORAGE_KEYS.CONNECTIONS, conn.id);
              EduSyncEngine.broadcastConnectionCancel(conn, AppState.currentUser);
              showToast(t('deletedSuccess'), 'info');
              renderApp();
            }
            break;
          }

          case 'force-edu-sync':
            EduSyncEngine.setupSubscriptionsForCurrentUser();
            showToast(AppState.lang === 'ar' ? 'تمت مزامنة البيانات عبر الأجهزة!' : 'Synchronized across devices!', 'success');
            break;

          case 'quick-assign-lesson-to-student': {
            const studentId = actionBtn.getAttribute('data-student');
            const myLessons = StorageService.filterByOwner(STORAGE_KEYS.LESSONS, AppState.currentUser.id);
            if (myLessons[0]) {
              closeModal();
              openAssignLessonModal(myLessons[0].id, studentId);
            }
            break;
          }

          case 'quick-assign-quiz-to-student': {
            const studentId = actionBtn.getAttribute('data-student');
            const myQuizzes = StorageService.filterByOwner(STORAGE_KEYS.QUIZZES, AppState.currentUser.id);
            if (myQuizzes[0]) {
              closeModal();
              openAssignQuizModal(myQuizzes[0].id, studentId);
            }
            break;
          }

          /* Lesson Actions */
          case 'clear-lesson-filters':
            AppState.filters.lessonSearch = '';
            AppState.filters.lessonGrade = 'all';
            AppState.filters.lessonUnit = 'all';
            AppState.filters.lessonTerm = 'all';
            renderApp();
            break;

          case 'view-lesson':
            openLessonDetailModal(id);
            break;

          case 'watch-video':
            openLessonDetailModal(id);
            break;

          case 'toggle-complete-lesson':
            if (AppState.currentUser) {
              toggleLessonCompleted(AppState.currentUser.id, id);
              closeModal();
            }
            break;

          case 'open-lesson-modal':
            openLessonFormModal(id || null);
            break;

          case 'save-lesson':
            saveLessonFromModal();
            break;

          case 'toggle-lesson-publish': {
            const user = AppState.currentUser;
            const lesson = StorageService.findById(STORAGE_KEYS.LESSONS, id);
            if (!lesson || !PermissionService.canModifyRecord(user, lesson)) {
              showToast(t('unauthorizedAccess'), 'error');
              break;
            }
            const nextStatus = lesson.status === 'published' ? 'draft' : 'published';
            StorageService.updateRecord(STORAGE_KEYS.LESSONS, id, {
              ...lesson,
              status: nextStatus,
              updatedBy: user.id,
              updatedAt: new Date().toISOString()
            });
            showToast(t('savedSuccess'), 'success');
            renderApp();
            break;
          }

          case 'open-assign-lesson-modal':
            openAssignLessonModal(id);
            break;

          case 'confirm-assign-lesson': {
            const user = AppState.currentUser;
            const lessonId = document.getElementById('assignLessonTargetId').value;
            const lesson = StorageService.findById(STORAGE_KEYS.LESSONS, lessonId);
            if (!lesson || !PermissionService.canModifyRecord(user, lesson)) {
              showToast(t('unauthorizedAccess'), 'error');
              break;
            }
            const recipientIds = resolveSelectedRecipientStudentIds(user.id, lesson.grade);
            if (recipientIds.length === 0) {
              const err = document.getElementById('assignLessonError');
              if (err) {
                err.textContent = t('noConnectedStudentsWarn');
                err.classList.remove('hidden');
              }
              break;
            }
            assignLessonToStudents(lesson, user, recipientIds);
            closeModal();
            showToast(t('assignedSuccessToast'), 'success');
            renderApp();
            break;
          }

          case 'delete-lesson':
            confirmDeleteLesson(id);
            break;

          /* Quiz Management Actions */
          case 'open-quiz-editor':
            openQuizEditorModal(id || null);
            break;

          case 'toggle-quiz-publish': {
            const user = AppState.currentUser;
            const quiz = StorageService.findById(STORAGE_KEYS.QUIZZES, id);
            if (!quiz || !PermissionService.canModifyRecord(user, quiz)) {
              showToast(t('unauthorizedAccess'), 'error');
              break;
            }
            const nextStatus = quiz.status === 'draft' ? 'published' : 'draft';
            StorageService.updateRecord(STORAGE_KEYS.QUIZZES, id, {
              ...quiz,
              status: nextStatus,
              updatedBy: user.id,
              updatedAt: new Date().toISOString()
            });
            showToast(t('savedSuccess'), 'success');
            renderApp();
            break;
          }

          case 'open-assign-quiz-modal':
            openAssignQuizModal(id);
            break;

          case 'confirm-assign-quiz': {
            const user = AppState.currentUser;
            const quizId = document.getElementById('assignQuizTargetId').value;
            const dueDate = document.getElementById('assignQuizDueDate').value;
            const quiz = StorageService.findById(STORAGE_KEYS.QUIZZES, quizId);
            if (!quiz || !PermissionService.canModifyRecord(user, quiz)) {
              showToast(t('unauthorizedAccess'), 'error');
              break;
            }
            const recipientIds = resolveSelectedRecipientStudentIds(user.id, quiz.grade);
            if (recipientIds.length === 0) {
              const err = document.getElementById('assignQuizError');
              if (err) {
                err.textContent = t('noConnectedStudentsWarn');
                err.classList.remove('hidden');
              }
              break;
            }
            assignQuizToStudents(quiz, user, recipientIds, dueDate);
            closeModal();
            showToast(t('assignedSuccessToast'), 'success');
            renderApp();
            break;
          }

          case 'quiz-add-question':
            syncDraftQuizFromDom();
            if (draftQuizEditorState) {
              draftQuizEditorState.questions.push({
                id: 'q_' + Date.now(),
                textEn: '',
                textAr: '',
                choicesEn: ['', '', '', ''],
                choicesAr: ['', '', '', ''],
                correctIndex: 0,
                points: 2
              });
              renderQuizEditorModalContents();
            }
            break;

          case 'quiz-remove-q': {
            syncDraftQuizFromDom();
            const qIdx = Number(actionBtn.getAttribute('data-index'));
            if (draftQuizEditorState && draftQuizEditorState.questions.length > 1) {
              draftQuizEditorState.questions.splice(qIdx, 1);
              renderQuizEditorModalContents();
            }
            break;
          }

          case 'quiz-move-q': {
            syncDraftQuizFromDom();
            const qIdx = Number(actionBtn.getAttribute('data-index'));
            const dir = Number(actionBtn.getAttribute('data-dir'));
            const targetIdx = qIdx + dir;

          case 'filter-student-quizzes':

              AppState.activeQuizSession.viewMode =

          case 'jump-question':

          case 'select-theme': {

            if (modal && !modal.classList.contains('hidden') && document.querySelector('.theme-selector-grid')) {
