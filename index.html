  <style>
    /* =========================================================================
       2. CSS VARIABLES AND THEME
       Easy-to-customize branding palette inspired by modern Egyptian LMS platforms
       ========================================================================= */
    :root {
      --navy-950: #0a1122;
      --navy-900: #0f172a;
      --navy-800: #1e293b;
      --navy-700: #334155;
      --hero-navy: #0f172a;
      --sidebar-bg: #0f172a;
      --sidebar-text: #f8fafc;
      --sidebar-muted: #cbd5e1;
      --sidebar-border: rgba(255, 255, 255, 0.08);
      --sidebar-hover-bg: rgba(255, 255, 255, 0.07);
      --toast-bg: #0f172a;
      --table-row-hover: #f8fafc;
      --primary-700: #1d4ed8;
      --primary-600: #2563eb;
      --primary-500: #3b82f6;
      --primary-100: #dbeafe;
      --primary-50: #eff6ff;
      --teal-700: #0f766e;
      --teal-600: #0d9488;
      --teal-500: #14b8a6;
      --teal-100: #ccfbf1;
      --teal-50: #f0fdfa;
      --amber-600: #d97706;
      --amber-100: #fef3c7;
      --amber-50: #fffbeb;
      --danger-600: #dc2626;
      --danger-100: #fee2e2;
      --danger-50: #fef2f2;
      --success-600: #16a34a;
      --success-100: #dcfce7;
      --success-50: #f0fdf4;
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-focus: #2563eb;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.14);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 22px;
      --sidebar-width: 274px;
      --sidebar-collapsed-width: 78px;
      --topbar-height: 68px;
      --transition-fast: 160ms cubic-bezier(0.4, 0, 0.2, 1);
      --font-sans: 'Cairo', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color var(--transition-fast);
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    a {
      color: var(--primary-600);
      text-decoration: none;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    .app-root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hidden {
      display: none !important;
    }

    /* Auth View Styles */
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.14), transparent 40%),
                  radial-gradient(circle at 85% 80%, rgba(13, 148, 136, 0.16), transparent 40%),
                  linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 1.5rem;
    }

    .auth-topbar {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.01em;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary-600), var(--teal-500));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 6px 16px rgba(20, 184, 166, 0.3);
      flex-shrink: 0;
    }

    .auth-container {
      max-width: 1160px;
      width: 100%;
      margin: 1.5rem auto;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 2.25rem;
      align-items: start;
    }

    .auth-hero {
      padding: 1rem 0;
    }

    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      background: rgba(20, 184, 166, 0.18);
      border: 1px solid rgba(20, 184, 166, 0.4);
      color: #5eead4;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 1.15rem;
    }

    .auth-hero h1 {
      font-size: clamp(1.75rem, 3vw, 2.55rem);
      line-height: 1.25;
      font-weight: 800;
      margin-bottom: 1rem;
      color: #ffffff;
    }

    .auth-hero p {
      color: #cbd5e1;
      font-size: 1.02rem;
      margin-bottom: 1.5rem;
      max-width: 540px;
    }

    .auth-grade-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .auth-grade-pill {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      flex: 1 1 150px;
    }

    .auth-grade-pill strong {
      display: block;
      color: #38bdf8;
      font-size: 0.95rem;
    }

    .auth-grade-pill span {
      font-size: 0.82rem;
      color: #cbd5e1;
    }

    .auth-card {
      background: var(--bg-surface);
      color: var(--text-main);
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      background: var(--bg-subtle);
      padding: 0.35rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.35rem;
    }

    .auth-tab-btn {
      padding: 0.55rem 0.85rem;
      border-radius: var(--radius-sm);
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--text-secondary);
      transition: all var(--transition-fast);
    }

    .auth-tab-btn.active {
      background: var(--bg-surface);
      color: var(--primary-700);
      box-shadow: var(--shadow-xs);
    }

    .auth-card h2 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--navy-900);
      margin-bottom: 0.25rem;
    }

    .auth-card .subtitle {
      color: var(--text-secondary);
      font-size: 0.88rem;
      margin-bottom: 1.25rem;
    }

    .role-selector-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-bottom: 1rem;
    }

    .role-option-btn {
      padding: 0.7rem 0.85rem;
      border-radius: var(--radius-sm);
      border: 2px solid var(--border-color);
      background: var(--bg-surface);
      font-weight: 700;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      transition: all var(--transition-fast);
    }

    .role-option-btn.selected {
      border-color: var(--primary-600);
      background: var(--primary-50);
      color: var(--primary-700);
    }

    .form-group {
      margin-bottom: 0.95rem;
    }

    .form-label {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--navy-800);
      margin-bottom: 0.35rem;
    }

    .form-control {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      color: var(--text-main);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .form-control:focus {
      border-color: var(--primary-600);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
      outline: none;
    }

    .form-error {
      color: var(--danger-600);
      background: var(--danger-50);
      border: 1px solid var(--danger-100);
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .form-success {
      color: var(--success-600);
      background: var(--success-50);
      border: 1px solid var(--success-100);
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .demo-accounts-box {
      margin-top: 1.25rem;
      padding-top: 1.1rem;
      border-top: 1px dashed var(--border-color);
    }

    .demo-accounts-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .demo-btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.45rem;
    }

    .demo-fill-btn {
      padding: 0.45rem 0.6rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-subtle);
      color: var(--navy-800);
      font-size: 0.78rem;
      font-weight: 600;
      text-align: start;
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
      gap: 0.05rem;
    }

    .demo-fill-btn:hover {
      border-color: var(--primary-500);
      background: var(--primary-50);
      color: var(--primary-700);
    }

    .demo-fill-btn small {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .security-disclaimer {
      margin-top: 0.9rem;
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius-sm);
      background: var(--amber-50);
      border: 1px solid var(--amber-100);
      color: #92400e;
      font-size: 0.76rem;
      line-height: 1.45;
    }

    /* Main Workspace Shell */
    .workspace-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
      position: relative;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      position: sticky;
      top: 0;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width var(--transition-fast), transform var(--transition-fast);
      z-index: 40;
      border-inline-end: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sidebar.collapsed {
      width: var(--sidebar-collapsed-width);
    }

    .sidebar-header {
      height: var(--topbar-height);
      padding: 0 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      gap: 0.6rem;
    }

    .sidebar.collapsed .sidebar-brand-text,
    .sidebar.collapsed .nav-item-label,
    .sidebar.collapsed .sidebar-footer-text,
    .sidebar.collapsed .sidebar-role-chip,
    .sidebar.collapsed .nav-badge {
      display: none;
    }

    .sidebar-role-chip {
      margin: 0.75rem 0.9rem 0.2rem;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.06);
      font-size: 0.75rem;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .sidebar-role-chip strong {
      color: #38bdf8;
      font-weight: 700;
    }

    .sidebar-nav {
      flex: 1;
      padding: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      width: 100%;
      padding: 0.64rem 0.85rem;
      border-radius: var(--radius-sm);
      color: #cbd5e1;
      font-weight: 600;
      font-size: 0.88rem;
      text-align: start;
      transition: all var(--transition-fast);
    }

    .nav-item-start {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .sidebar.collapsed .nav-item {
      justify-content: center;
      padding: 0.7rem 0.45rem;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #ffffff;
    }

    .nav-item.active {
      background: linear-gradient(135deg, var(--primary-600), var(--teal-600));
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.28);
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-badge {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
    }

    .sidebar-footer {
      padding: 0.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    /* Main Content Area */
    .main-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-body);
    }

    /* Top Navigation Bar */
    .topbar {
      height: var(--topbar-height);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-start {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      min-width: 0;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--navy-800);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      position: relative;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: var(--bg-subtle);
      border-color: #cbd5e1;
    }

    .page-heading-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--navy-900);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-end {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-shrink: 0;
    }

    .lang-switch-btn {
      height: 38px;
      padding: 0 0.85rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-subtle);
      color: var(--navy-900);
      font-weight: 700;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all var(--transition-fast);
    }

    .lang-switch-btn:hover {
      border-color: var(--primary-600);
      color: var(--primary-700);
      background: var(--primary-50);
    }

    .notif-badge {
      position: absolute;
      top: -4px;
      inset-inline-end: -4px;
      background: var(--danger-600);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Profile & Notification Dropdowns */
    .dropdown-wrapper {
      position: relative;
    }

    .profile-trigger {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.35rem 0.65rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      transition: all var(--transition-fast);
    }

    .profile-trigger:hover {
      background: var(--bg-subtle);
    }

    .avatar-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-600), var(--teal-600));
      color: #ffffff;
      font-weight: 800;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .profile-trigger-meta {
      text-align: start;
      line-height: 1.2;
    }

    .profile-trigger-name {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--navy-900);
      display: block;
    }

    .profile-trigger-role {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: block;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      inset-inline-end: 0;
      min-width: 280px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 0.5rem;
      z-index: 60;
    }

    .dropdown-header {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 0.35rem;
    }

    .dropdown-item {
      width: 100%;
      padding: 0.58rem 0.75rem;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-main);
      text-align: start;
      transition: background var(--transition-fast);
    }

    .dropdown-item:hover {
      background: var(--bg-subtle);
    }

    .dropdown-item.danger {
      color: var(--danger-600);
    }

    .dropdown-item.danger:hover {
      background: var(--danger-50);
    }

    /* Main Content Container */
    .content-area {
      flex: 1;
      padding: 1.5rem;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    /* Common Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.6rem 1.1rem;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.88rem;
      transition: all var(--transition-fast);
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn-sm {
      padding: 0.38rem 0.72rem;
      font-size: 0.78rem;
    }

    .btn-primary {
      background: var(--primary-600);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }

    .btn-primary:hover {
      background: var(--primary-700);
    }

    .btn-teal {
      background: var(--teal-600);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(13, 148, 136, 0.25);
    }

    .btn-teal:hover {
      background: var(--teal-700);
    }

    .btn-outline {
      background: var(--bg-surface);
      border-color: var(--border-color);
      color: var(--navy-800);
    }

    .btn-outline:hover {
      background: var(--bg-subtle);
      border-color: #cbd5e1;
    }

    .btn-danger {
      background: var(--danger-600);
      color: #ffffff;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }

    .btn-subtle-danger {
      background: var(--danger-50);
      color: var(--danger-600);
      border-color: var(--danger-100);
    }

    .btn-subtle-danger:hover {
      background: var(--danger-100);
    }

    /* Dashboard Cards & Grids */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(205px, 1fr));
      gap: 1.05rem;
      margin-bottom: 1.4rem;
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.15rem 1.25rem;
      box-shadow: var(--shadow-xs);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.85rem;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .stat-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.25rem;
    }

    .stat-value {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--navy-900);
      line-height: 1.15;
    }

    .stat-meta {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 0.28rem;
    }

    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stat-icon.blue { background: var(--primary-50); color: var(--primary-600); }
    .stat-icon.teal { background: var(--teal-50); color: var(--teal-600); }
    .stat-icon.amber { background: var(--amber-50); color: var(--amber-600); }
    .stat-icon.green { background: var(--success-50); color: var(--success-600); }

    /* Panel & Section Cards */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-xs);
      margin-bottom: 1.35rem;
      overflow: hidden;
    }

    .card-header {
      padding: 1.05rem 1.3rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .card-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--navy-900);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-body {
      padding: 1.3rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.2rem;
    }

    /* Filter Bar */
    .filter-bar {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.95rem 1.15rem;
      margin-bottom: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.85rem;
    }

    .filter-group {
      flex: 1 1 170px;
      min-width: 145px;
    }

    .filter-group label {
      display: block;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 0.28rem;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.22rem 0.65rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-grade-7 { background: #e0f2fe; color: #0369a1; }
    .badge-grade-8 { background: #ede9fe; color: #6d28d9; }
    .badge-grade-9 { background: #ccfbf1; color: #0f766e; }
    .badge-pass { background: var(--success-100); color: var(--success-600); }
    .badge-fail { background: var(--danger-100); color: var(--danger-600); }
    .badge-neutral { background: var(--bg-subtle); color: var(--text-secondary); }
    .badge-amber { background: var(--amber-100); color: var(--amber-600); }
    .badge-primary { background: var(--primary-100); color: var(--primary-700); }

    /* Code Banner Pill */
    .code-pill-box {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--bg-subtle);
      border: 1px dashed var(--primary-500);
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-sm);
      font-family: monospace;
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--primary-700);
    }

    /* Lesson & Quiz Cards */
    .lesson-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    .lesson-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .lesson-thumb {
      height: 142px;
      background: linear-gradient(135deg, var(--hero-navy) 0%, var(--primary-700) 60%, var(--teal-600) 100%);
      padding: 0.95rem 1.1rem;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .lesson-thumb.grade-8 {
      background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 60%, #0d9488 100%);
    }

    .lesson-thumb.grade-9 {
      background: linear-gradient(135deg, #0f172a 0%, #0f766e 60%, #0284c7 100%);
    }

    .lesson-thumb-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .lesson-thumb-unit {
      font-size: 0.76rem;
      opacity: 0.92;
      font-weight: 600;
    }

    .lesson-thumb-title {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.3;
    }

    .lesson-card-body {
      padding: 1.1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.9rem;
    }

    .lesson-desc {
      font-size: 0.86rem;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .lesson-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .lesson-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding-top: 0.7rem;
      border-top: 1px solid var(--border-color);
    }

    /* Data Tables */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: start;
      font-size: 0.86rem;
    }

    .data-table th {
      background: var(--bg-subtle);
      color: var(--navy-800);
      font-weight: 700;
      padding: 0.75rem 0.95rem;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
      text-align: start;
    }

    .data-table td {
      padding: 0.8rem 0.95rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
      vertical-align: middle;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .data-table tbody tr:hover {
      background: var(--table-row-hover);
    }

    /* Progress Bars */
    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--bg-subtle);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-600), var(--teal-500));
      border-radius: 999px;
      transition: width 300ms ease;
    }

    /* Interactive Quiz Player */
    .quiz-player-box {
      max-width: 840px;
      margin: 0 auto;
    }

    .question-dots {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin: 1rem 0;
    }

    .question-dot {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      font-weight: 700;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .question-dot.current {
      border-color: var(--primary-600);
      background: var(--primary-600);
      color: #ffffff;
    }

    .question-dot.answered {
      border-color: var(--teal-600);
      background: var(--teal-50);
      color: var(--teal-700);
    }

    .option-card {
      width: 100%;
      padding: 0.95rem 1.15rem;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-color);
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-align: start;
      margin-bottom: 0.7rem;
      transition: all var(--transition-fast);
      font-weight: 600;
    }

    .option-card:hover {
      border-color: var(--primary-500);
      background: var(--primary-50);
    }

    .option-card.selected {
      border-color: var(--primary-600);
      background: var(--primary-50);
      color: var(--primary-700);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.14);
    }

    .option-letter {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg-subtle);
      color: var(--navy-800);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
    }

    .option-card.selected .option-letter {
      background: var(--primary-600);
      color: #ffffff;
    }

    /* Video Embed Wrapper */
    .video-frame-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: var(--navy-950);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .video-frame-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Modals & Dialogs */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-dialog {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      max-width: 760px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .modal-dialog.modal-sm {
      max-width: 460px;
    }

    .modal-dialog.modal-lg {
      max-width: 940px;
    }

    .modal-header {
      padding: 1.05rem 1.35rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--navy-900);
    }

    .modal-body {
      padding: 1.35rem;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      padding: 0.95rem 1.35rem;
      border-top: 1px solid var(--border-color);
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    /* Recipient Checkboxes */
    .student-check-list {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0.6rem;
      background: var(--bg-subtle);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 0.45rem;
    }

    .student-check-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.6rem;
      background: var(--bg-surface);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      bottom: 1.25rem;
      inset-inline-end: 1.25rem;
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-width: 380px;
      width: calc(100% - 2.5rem);
      pointer-events: none;
    }

    .toast-item {
      pointer-events: none;
      background: var(--toast-bg);
      color: #ffffff;
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.88rem;
      font-weight: 600;
      border-inline-start: 4px solid var(--teal-500);
    }

    .toast-item.error { border-inline-start-color: var(--danger-600); }
    .toast-item.success { border-inline-start-color: var(--success-600); }
    .toast-item.warning { border-inline-start-color: var(--amber-600); }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 2.2rem 1.2rem;
      color: var(--text-muted);
    }

    .empty-state h4 {
      color: var(--navy-800);
      font-size: 1.02rem;
      margin-bottom: 0.35rem;
    }

    /* Simple Bar Charts */
    .chart-row {
      margin-bottom: 0.85rem;
    }

    .chart-row-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 0.28rem;
      color: var(--navy-800);
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .sidebar-backdrop {
      display: none;
    }

    .mqtt-status-pill {
      height: 38px;
      padding: 0 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-subtle);
      font-size: 0.78rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--navy-800);
    }

    .mqtt-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--amber-600);
      display: inline-block;
    }

    .mqtt-dot.online {
      background: var(--success-600);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18);
    }


    /* =========================================================================
       2B. CENTRALIZED EDUCATIONAL THEME SYSTEM & ACCENT PALETTES
       Themes: original (Default), light, dark, eye-comfort
       Accents: royal-blue, emerald-teal, academic-indigo, bio-emerald,
                cosmic-violet, solar-amber, rose-coral
       ========================================================================= */
    html[data-theme="original"] {
      color-scheme: light;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg-body: #f4f7fb;
      --bg-surface: #ffffff;
      --bg-subtle: #edf2f7;
      --text-main: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --navy-900: #0f172a;
      --navy-800: #1e293b;
      --border-color: #d8e2ef;
      --sidebar-bg: #ffffff;
      --sidebar-text: #0f172a;
      --sidebar-muted: #475569;
      --sidebar-border: #e2e8f0;
      --sidebar-hover-bg: #f1f5f9;
      --table-row-hover: #f1f5f9;
    }

    html[data-theme="light"] .sidebar {
      border-inline-end: 1px solid var(--border-color);
      box-shadow: var(--shadow-xs);
    }

    html[data-theme="light"] .sidebar-header,
    html[data-theme="light"] .sidebar-footer {
      border-color: var(--border-color);
    }

    html[data-theme="light"] .sidebar-role-chip {
      background: var(--bg-subtle);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    html[data-theme="light"] .sidebar-role-chip strong {
      color: var(--primary-700);
    }

    html[data-theme="light"] .nav-item {
      color: var(--text-secondary);
    }

    html[data-theme="light"] .nav-item:hover {
      background: var(--bg-subtle);
      color: var(--navy-900);
    }

    html[data-theme="light"] .nav-item.active {
      color: #ffffff;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg-body: #0b1120;
      --bg-surface: #131c31;
      --bg-subtle: #1e293b;
      --text-main: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --navy-900: #f8fafc;
      --navy-800: #e2e8f0;
      --navy-700: #cbd5e1;
      --hero-navy: #090f1d;
      --sidebar-bg: #0d1526;
      --sidebar-text: #f8fafc;
      --sidebar-muted: #cbd5e1;
      --toast-bg: #1e293b;
      --border-color: #26354d;
      --table-row-hover: rgba(255, 255, 255, 0.04);
      --primary-100: rgba(59, 130, 246, 0.24);
      --primary-50: rgba(59, 130, 246, 0.14);
      --teal-100: rgba(20, 184, 166, 0.24);
      --teal-50: rgba(20, 184, 166, 0.14);
      --amber-100: rgba(217, 119, 6, 0.26);
      --amber-50: rgba(217, 119, 6, 0.15);
      --danger-100: rgba(220, 38, 38, 0.26);
      --danger-50: rgba(220, 38, 38, 0.15);
      --success-100: rgba(22, 163, 74, 0.26);
      --success-50: rgba(22, 163, 74, 0.15);
      --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.35);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 10px 26px rgba(0, 0, 0, 0.48);
      --shadow-lg: 0 18px 40px rgba(0, 0, 0, 0.6);
    }

    html[data-theme="dark"] .security-disclaimer {
      color: #fde68a;
    }

    html[data-theme="dark"] .badge-grade-7 { background: rgba(14, 165, 233, 0.22); color: #7dd3fc; }
    html[data-theme="dark"] .badge-grade-8 { background: rgba(139, 92, 246, 0.24); color: #c4b5fd; }
    html[data-theme="dark"] .badge-grade-9 { background: rgba(20, 184, 166, 0.22); color: #5eead4; }
    html[data-theme="dark"] .badge-primary { background: var(--primary-100); color: #93c5fd; }
    html[data-theme="dark"] .badge-pass { background: var(--success-100); color: #86efac; }
    html[data-theme="dark"] .badge-fail { background: var(--danger-100); color: #fca5a5; }
    html[data-theme="dark"] .badge-amber { background: var(--amber-100); color: #fcd34d; }
    html[data-theme="dark"] .option-card.selected { color: #93c5fd; }
    html[data-theme="dark"] .auth-tab-btn.active { color: #93c5fd; }

    html[data-theme="eye-comfort"] {
      color-scheme: light;
      --bg-body: #f4efe4;
      --bg-surface: #fbf8f1;
      --bg-subtle: #ebe4d4;
      --text-main: #2b251f;
      --text-secondary: #52473c;
      --text-muted: #736658;
      --navy-900: #25201a;
      --navy-800: #3a322a;
      --navy-700: #52473c;
      --hero-navy: #232f2b;
      --sidebar-bg: #232f2b;
      --sidebar-text: #f5f2eb;
      --sidebar-muted: #d0c8b8;
      --toast-bg: #25201a;
      --border-color: #d8cebc;
      --table-row-hover: #efe9da;
      --primary-50: #e9f0ec;
      --primary-100: #d1e2d9;
      --amber-50: #f9f1de;
      --amber-100: #efe0bc;
    }

    html[data-theme="eye-comfort"] .auth-wrapper {
      background: radial-gradient(circle at 15% 20%, rgba(13, 148, 136, 0.14), transparent 40%),
                  linear-gradient(135deg, #212c28 0%, #2d3b36 100%);
    }

    /* Curated Custom Accent Palettes */
    html[data-accent="royal-blue"] {
      --primary-700: #1d4ed8;
      --primary-600: #2563eb;
      --primary-500: #3b82f6;
      --border-focus: #2563eb;
    }

    html[data-accent="emerald-teal"] {
      --primary-700: #0f766e;
      --primary-600: #0d9488;
      --primary-500: #14b8a6;
      --primary-100: #ccfbf1;
      --primary-50: #f0fdfa;
      --border-focus: #0d9488;
    }

    html[data-accent="academic-indigo"] {
      --primary-700: #4338ca;
      --primary-600: #4f46e5;
      --primary-500: #6366f1;
      --primary-100: #e0e7ff;
      --primary-50: #eef2ff;
      --border-focus: #4f46e5;
    }

    html[data-accent="bio-emerald"] {
      --primary-700: #047857;
      --primary-600: #059669;
      --primary-500: #10b981;
      --primary-100: #d1fae5;
      --primary-50: #ecfdf5;
      --border-focus: #059669;
    }

    html[data-accent="cosmic-violet"] {
      --primary-700: #6d28d9;
      --primary-600: #7c3aed;
      --primary-500: #8b5cf6;
      --primary-100: #ede9fe;
      --primary-50: #f5f3ff;
      --border-focus: #7c3aed;
    }

    html[data-accent="solar-amber"] {
      --primary-700: #b45309;
      --primary-600: #d97706;
      --primary-500: #f59e0b;
      --primary-100: #fef3c7;
      --primary-50: #fffbeb;
      --border-focus: #d97706;
    }

    html[data-accent="rose-coral"] {
      --primary-700: #be123c;
      --primary-600: #e11d48;
      --primary-500: #f43f5e;
      --primary-100: #ffe4e6;
      --primary-50: #fff1f2;
      --border-focus: #e11d48;
    }

    html[data-theme="dark"][data-accent="emerald-teal"],
    html[data-theme="dark"][data-accent="academic-indigo"],
    html[data-theme="dark"][data-accent="bio-emerald"],
    html[data-theme="dark"][data-accent="cosmic-violet"],
    html[data-theme="dark"][data-accent="solar-amber"],
    html[data-theme="dark"][data-accent="rose-coral"] {
      --primary-100: rgba(255, 255, 255, 0.14);
      --primary-50: rgba(255, 255, 255, 0.07);
    }

    /* Official NAYRA LEARNING Logo Preservation Rules */
    .nayra-logo-img {
      display: block;
      object-fit: contain;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      background-color: #061336;
      box-shadow: 0 4px 12px rgba(6, 19, 54, 0.28);
      flex-shrink: 0;
      filter: none !important;
      user-select: none;
    }

    .nayra-logo-img.logo-sm {
      width: 38px;
      height: 38px;
      border-radius: 9px;
    }

    .nayra-logo-img.logo-md {
      width: 46px;
      height: 46px;
      border-radius: 11px;
    }

    .nayra-logo-img.logo-hero {
      width: 118px;
      height: 118px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(3, 12, 38, 0.45);
      border: 2px solid rgba(56, 189, 248, 0.32);
    }

    /* Never apply theme filters to videos or instructional visuals */
    .video-frame-wrapper iframe,
    .video-frame-wrapper video,
    .nayra-logo-img {
      filter: none !important;
    }

    /* Theme & Accent Picker Cards */
    .theme-selector-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.9rem;
      margin-bottom: 1.35rem;
    }

    .theme-option-card {
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      padding: 0.9rem 1rem;
      text-align: start;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      transition: all var(--transition-fast);
      position: relative;
    }

    .theme-option-card:hover {
      border-color: var(--primary-500);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .theme-option-card.active {
      border-color: var(--primary-600);
      background: var(--primary-50);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .theme-preview-swatch {
      height: 46px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(148, 163, 184, 0.35);
      display: flex;
      overflow: hidden;
    }

    .accent-swatch-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      align-items: center;
    }

    .accent-swatch-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      border: 2px solid var(--border-color);
      background: var(--bg-surface);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      transition: all var(--transition-fast);
    }

    .accent-swatch-btn:hover {
      border-color: var(--primary-500);
    }

    .accent-swatch-btn.active {
      border-color: var(--primary-600);
      background: var(--primary-50);
    }

    .accent-color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35);
    }

    /* Platform Footer & Intellectual Property Bar */
    .platform-footer {
      margin-top: auto;
      padding: 1.15rem 1.5rem;
      border-top: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 0.82rem;
    }

    .auth-wrapper .platform-footer {
      max-width: 1200px;
      width: 100%;
      margin: 1.5rem auto 0;
      background: rgba(15, 23, 42, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-md);
      color: #cbd5e1;
    }

    .platform-footer-inner {
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.85rem 1.5rem;
    }

    .footer-brand-cluster {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .footer-links-cluster {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .footer-link-btn {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary-600);
      text-decoration: underline;
      text-underline-offset: 3px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.15rem 0.25rem;
    }

    .auth-wrapper .footer-link-btn {
      color: #38bdf8;
    }

    /* Initial Loading Splash Screen */
    .nayra-loading-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #061336 0%, #0f172a 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 200;
      transition: opacity 220ms ease;
    }

    .nayra-loading-screen.hidden {
      display: none !important;
    }

    html {
      overflow-x: hidden;
    }

    @media (max-width: 992px) {
      .sidebar:not(.mobile-open) {
        visibility: hidden;
        pointer-events: none;
      }
    }

    @media (max-width: 640px) {
      .mqtt-status-pill span:not(.mqtt-dot) {
        display: none;
      }
      .mqtt-status-pill {
        padding: 0 0.55rem;
      }
    }

    /* =========================================================================
       3. RESPONSIVE STYLES (Desktop, Tablet, Mobile 320px - 1440px, RTL/LTR)
       ========================================================================= */
    @media (max-width: 992px) {
      .auth-container {
        grid-template-columns: 1fr;
        gap: 1.75rem;
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        inset-inline-start: 0;
        width: var(--sidebar-width) !important;
        transform: translateX(-105%);
      }

      html[dir="rtl"] .sidebar {
        transform: translateX(105%);
      }

      .sidebar.mobile-open {
        transform: translateX(0) !important;
      }

      .sidebar-backdrop.active {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.5);
        z-index: 35;
      }
    }

    @media (max-width: 640px) {
      .content-area {
        padding: 1rem;
      }

      .topbar {
        padding: 0 0.85rem;
      }

      .auth-card {
        padding: 1.35rem;
      }

      .demo-btn-grid {
        grid-template-columns: 1fr;
      }

      .profile-trigger-meta {
        display: none;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

    };

    const memoryFallback = (() => {
      try {
        if (window.name && window.name.startsWith('__SLH_STORE__')) {
          return JSON.parse(window.name.slice('__SLH_STORE__'.length)) || {};
        }
      } catch (_) {}
      return {};
    })();

    function persistWindowNameBackup() {
      try {
        window.name = '__SLH_STORE__' + JSON.stringify(memoryFallback);
      } catch (_) {}
    }

    const StorageService = {
      readData(key, fallback = null) {
        try {
          const raw = window.localStorage.getItem(key);
          if (raw === null || raw === undefined) {
            return key in memoryFallback ? memoryFallback[key] : fallback;
          }
          const parsed = JSON.parse(raw);
          if (parsed !== null && parsed !== undefined) {
            memoryFallback[key] = parsed;
            return parsed;
          }
          return key in memoryFallback ? memoryFallback[key] : fallback;
        } catch (err) {
          return key in memoryFallback ? memoryFallback[key] : fallback;
        }
      },

      saveData(key, value) {
        memoryFallback[key] = value;
        persistWindowNameBackup();
        try {
          window.localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (err) {
          return false;
        }
      },

      addRecord(key, record) {
        const list = this.readData(key, []);
        const safeList = Array.isArray(list) ? list : [];
        safeList.push(record);
        this.saveData(key, safeList);
        return record;
      },

      createRecord(key, record) {
        return this.addRecord(key, record);
      },

      updateRecord(key, id, updaterFn) {
        const list = this.readData(key, []);
        if (!Array.isArray(list)) return null;
        let updatedItem = null;
        const nextList = list.map(item => {
          if (item && item.id === id) {
            updatedItem = typeof updaterFn === 'function' ? updaterFn(item) : { ...item, ...updaterFn };
            return updatedItem;
          }
          return item;
        });
        this.saveData(key, nextList);
        return updatedItem;
      },

      deleteRecord(key, id) {
        const list = this.readData(key, []);
        if (!Array.isArray(list)) return false;
        const nextList = list.filter(item => item && item.id !== id);
        this.saveData(key, nextList);
        return nextList.length !== list.length;
      },

      findById(key, id) {
        const list = this.readData(key, []);
        if (!Array.isArray(list)) return null;
        return list.find(item => item && item.id === id) || null;
      },

      filterByOwner(key, ownerId) {
        const list = this.readData(key, []);
        if (!Array.isArray(list)) return [];
        return list.filter(item => item && (item.createdBy === ownerId || item.teacherId === ownerId));
      },

      filterAssignmentsByStudent(key, studentId) {
        const list = this.readData(key, []);
        if (!Array.isArray(list)) return [];
        return list.filter(item => item && item.studentId === studentId);
      },

      getConnectedStudentsForTeacher(teacherId, statusFilter = 'approved') {
        const connections = this.readData(STORAGE_KEYS.CONNECTIONS, []);
        const users = this.readData(STORAGE_KEYS.USERS, []);
        const matchedIds = new Set(
          connections
            .filter(c => c && c.teacherId === teacherId && (!statusFilter || c.status === statusFilter))
            .map(c => c.studentId)
        );
        return users.filter(u => u && u.role === 'student' && matchedIds.has(u.id));
      },

      getConnectedTeachersForStudent(studentId, statusFilter = 'approved') {
        const connections = this.readData(STORAGE_KEYS.CONNECTIONS, []);
        const users = this.readData(STORAGE_KEYS.USERS, []);
        const matchedIds = new Set(
          connections
            .filter(c => c && c.studentId === studentId && (!statusFilter || c.status === statusFilter))
            .map(c => c.teacherId)
        );
        return users.filter(u => u && u.role === 'teacher' && matchedIds.has(u.id));
      },

      createNotification({ recipientId, titleEn, titleAr, messageEn, messageAr, relatedId = '' }) {
        if (!recipientId) return null;
        const notif = {
          id: 'notif_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          recipientId,
          titleEn: titleEn || titleAr || 'Notification',
          titleAr: titleAr || titleEn || 'إشعار جديد',
          messageEn: messageEn || messageAr || '',
          messageAr: messageAr || messageEn || '',
          relatedId,
          read: false,
          createdAt: new Date().toISOString()
        };
        return this.addRecord(STORAGE_KEYS.NOTIFICATIONS, notif);
      },

      logActivity({ actorId, actionType, relatedId = '', descriptionEn, descriptionAr }) {
        const entry = {
          id: 'act_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          actorId: actorId || '',
          actionType: actionType || 'action',
          relatedId,
          descriptionEn: descriptionEn || descriptionAr || '',
          descriptionAr: descriptionAr || descriptionEn || '',
          createdAt: new Date().toISOString()
        };
        return this.addRecord(STORAGE_KEYS.ACTIVITY_LOGS, entry);
      },

      validateStoredData() {
        const defaults = getFactoryDemoData();
        const storedVersion = this.readData(STORAGE_KEYS.SCHEMA_VERSION, null);

        if (storedVersion !== CURRENT_SCHEMA_VERSION) {
          this.initializeDemoData(true);
          return;
        }

        const checkArrayKey = (k, defVal) => {
          const val = this.readData(k, null);
          if (!Array.isArray(val)) this.saveData(k, defVal);
        };

        const users = this.readData(STORAGE_KEYS.USERS, null);
        if (!Array.isArray(users) || !users.some(u => u && u.username === 'teacher')) {
          this.saveData(STORAGE_KEYS.USERS, defaults.users);
        }
        checkArrayKey(STORAGE_KEYS.CONNECTIONS, defaults.connections);
        checkArrayKey(STORAGE_KEYS.INVITATIONS, defaults.invitations);
        checkArrayKey(STORAGE_KEYS.LESSONS, defaults.lessons);
        checkArrayKey(STORAGE_KEYS.LESSON_ASSIGNMENTS, defaults.lessonAssignments);
        checkArrayKey(STORAGE_KEYS.QUIZZES, defaults.quizzes);
        checkArrayKey(STORAGE_KEYS.QUIZ_ASSIGNMENTS, defaults.quizAssignments);
        checkArrayKey(STORAGE_KEYS.ATTEMPTS, defaults.attempts);
        checkArrayKey(STORAGE_KEYS.NOTIFICATIONS, defaults.notifications);
        checkArrayKey(STORAGE_KEYS.ACTIVITY_LOGS, defaults.activityLogs);

        const settings = this.readData(STORAGE_KEYS.SETTINGS, null);
        if (!settings || typeof settings !== 'object') {
          this.saveData(STORAGE_KEYS.SETTINGS, defaults.settings);
        } else {
          if (!settings.platformNameEn || settings.platformNameEn === 'Science Learning Hub') {
            settings.platformNameEn = BRAND_CONFIG.nameEn;
          }
          if (!settings.platformNameAr || settings.platformNameAr === 'منصة تعلم العلوم الإعدادية') {
            settings.platformNameAr = BRAND_CONFIG.nameAr;
          }
          this.saveData(STORAGE_KEYS.SETTINGS, settings);
        }
      },

      initializeDemoData(forceReset = false) {
        if (forceReset) {
          const defaults = getFactoryDemoData();
          this.saveData(STORAGE_KEYS.SCHEMA_VERSION, CURRENT_SCHEMA_VERSION);
          this.saveData(STORAGE_KEYS.USERS, defaults.users);
          this.saveData(STORAGE_KEYS.CONNECTIONS, defaults.connections);
          this.saveData(STORAGE_KEYS.INVITATIONS, defaults.invitations);
          this.saveData(STORAGE_KEYS.LESSONS, defaults.lessons);
          this.saveData(STORAGE_KEYS.LESSON_ASSIGNMENTS, defaults.lessonAssignments);
          this.saveData(STORAGE_KEYS.QUIZZES, defaults.quizzes);
          this.saveData(STORAGE_KEYS.QUIZ_ASSIGNMENTS, defaults.quizAssignments);
          this.saveData(STORAGE_KEYS.ATTEMPTS, defaults.attempts);
          this.saveData(STORAGE_KEYS.NOTIFICATIONS, defaults.notifications);
          this.saveData(STORAGE_KEYS.ACTIVITY_LOGS, defaults.activityLogs);
          this.saveData(STORAGE_KEYS.SETTINGS, defaults.settings);
          return;
        }
        this.validateStoredData();
      }
    };

    function t(key, replacements = {}) {
      const dict = I18N[AppState.lang] || I18N.en;
      let str = dict[key] !== undefined ? dict[key] : (I18N.en[key] || key);
      Object.keys(replacements).forEach(k => {
        str = str.replace(`{${k}}`, replacements[k]);
      });
      return str;
    }

    function locText(obj, fieldBase) {
      if (!obj) return '';
      const arVal = obj[fieldBase + 'Ar'] || '';

      return AppState.lang === 'ar' ? (arVal || enVal) : (enVal || arVal);

    function formatGradeLabel(gradeNum, short = false) {
      const g = Number(gradeNum);
      if (g === 7) return short ? t('grade7Short') : t('grade7');
      if (g === 8) return short ? t('grade8Short') : t('grade8');
      if (g === 9) return short ? t('grade9Short') : t('grade9');
      return `${t('colGrade')} ${gradeNum}`;
    }

    function formatDate(isoStr) {
      if (!isoStr) return '—';
      try {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return isoStr;
        return d.toLocaleDateString(AppState.lang === 'ar' ? 'ar-EG' : 'en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (e) {
        return isoStr;
      }
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

      sanitizeUser(userObj) {

      login(usernameOrEmailInput, passwordInput) {
        const uClean = String(usernameOrEmailInput || '').trim().toLowerCase();
        const pClean = String(passwordInput || '').trim();
        if (!uClean || !pClean) {
          return { ok: false, message: t('emptyCredentials') };
        }
        const users = StorageService.readData(STORAGE_KEYS.USERS, []);
        const matched = users.find(
          u => u && (
            String(u.username || '').toLowerCase() === uClean ||
            (u.email && String(u.email).toLowerCase() === uClean)
          ) && String(u.password) === pClean
        );
        if (!matched) {
          return { ok: false, message: t('invalidLogin') };
        }
        resetTemporaryAccountState();
        AppState.currentUser = this.sanitizeUser(matched);
        AppState.currentPage = matched.role === 'teacher' ? 'teacher-overview' : 'student-dashboard';
        StorageService.saveData(STORAGE_KEYS.SESSION, {
          userId: matched.id,
          currentPage: AppState.currentPage,
          loggedInAt: new Date().toISOString()
        });
        ThemeService.loadAndApply();
        EduSyncEngine.setupSubscriptionsForCurrentUser();
        return { ok: true, user: AppState.currentUser };
      },

      register(formData) {
        const role = formData.role === 'teacher' ? 'teacher' : 'student';
        const fullName = String(formData.fullName || '').trim();
        const username = String(formData.username || '').trim().toLowerCase();
        const email = String(formData.email || '').trim().toLowerCase();
        const password = String(formData.password || '').trim();
        const confirmPassword = String(formData.confirmPassword || '').trim();

        if (!fullName || !username || !password || !confirmPassword) {
          return { ok: false, message: t('validationFailed') };
        }
        if (password !== confirmPassword) {
          return { ok: false, message: t('passwordMismatch') };
        }

        const users = StorageService.readData(STORAGE_KEYS.USERS, []);
        if (users.some(u => u && String(u.username || '').toLowerCase() === username)) {
          return { ok: false, message: t('usernameTaken') };
        }
        if (email && users.some(u => u && u.email && String(u.email).toLowerCase() === email)) {
          return { ok: false, message: t('emailTaken') };
        }

        let targetTeacherForConnection = null;
        let matchedInvitation = null;
        const connectCode = String(formData.connectCode || '').trim().toUpperCase();

        if (role === 'student' && connectCode) {
          const teachers = users.filter(u => u && u.role === 'teacher');
          targetTeacherForConnection = teachers.find(
            tc => String(tc.teacherCode || '').toUpperCase() === connectCode
          );
          if (!targetTeacherForConnection) {
            const invites = StorageService.readData(STORAGE_KEYS.INVITATIONS, []);
            matchedInvitation = invites.find(
              inv => inv && String(inv.code || '').toUpperCase() === connectCode && inv.status === 'active'
            );
            if (matchedInvitation) {
              targetTeacherForConnection = teachers.find(tc => tc.id === matchedInvitation.teacherId);
            }
          }
          if (!targetTeacherForConnection) {
            return { ok: false, message: t('invalidConnectCode') };
          }
        }

        const nowIso = new Date().toISOString();
        const newUserId = `u_${role}_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
        const displayName = role === 'teacher'
          ? (String(formData.displayName || '').trim() || fullName)
          : fullName;

        const newUser = {
          id: newUserId,
          username,
          email,
          password,
          role,
          grade: role === 'student' ? ([7, 8, 9].includes(Number(formData.grade)) ? Number(formData.grade) : 7) : null,
          studentCode: role === 'student' ? (formData.studentCode || generateUniqueCode('STU')) : null,
          teacherCode: role === 'teacher' ? (formData.teacherCode || generateUniqueCode('TCH')) : null,
          specializationEn: role === 'teacher' ? (String(formData.specialization || '').trim() || 'General Science') : '',
          specializationAr: role === 'teacher' ? (String(formData.specialization || '').trim() || 'العلوم العامة') : '',
          nameEn: displayName,
          nameAr: displayName,
          fullName,
          createdAt: nowIso,
          updatedAt: nowIso
        };

        StorageService.addRecord(STORAGE_KEYS.USERS, newUser);
        StorageService.logActivity({
          actorId: newUserId,
          actionType: 'account_created',
          relatedId: newUserId,
          descriptionEn: `New ${role} account registered: ${displayName} (@${username})`,
          descriptionAr: `تم تسجيل حساب ${role === 'teacher' ? 'معلم' : 'طالب'} جديد: ${displayName} (@${username})`
        });

        if (role === 'student' && targetTeacherForConnection) {
          const isInviteApproved = Boolean(matchedInvitation);
          const connRecord = {
            id: 'conn_' + Date.now(),
            teacherId: targetTeacherForConnection.id,
            studentId: newUserId,
            status: isInviteApproved ? 'approved' : 'pending',
            createdAt: nowIso,
            updatedAt: nowIso
          };
          StorageService.addRecord(STORAGE_KEYS.CONNECTIONS, connRecord);

          if (matchedInvitation) {
            StorageService.updateRecord(STORAGE_KEYS.INVITATIONS, matchedInvitation.id, {
              ...matchedInvitation,
              status: 'used',
              usedBy: newUserId
            });
          }

          StorageService.createNotification({
            recipientId: targetTeacherForConnection.id,
            titleEn: isInviteApproved
              ? `New Student Connected via Invite: ${displayName}`
              : `New Connection Request: ${displayName}`,
            titleAr: isInviteApproved
              ? `انضم طالب جديد عبر كود الدعوة: ${displayName}`
              : `طلب ارتباط جديد من الطالب: ${displayName}`,
            messageEn: `${displayName} (Grade ${newUser.grade}) ${isInviteApproved ? 'connected using invitation code ' + matchedInvitation.code : 'requested to connect using your teacher code'}.`,
            messageAr: `قام ${displayName} (الصف ${newUser.grade}) ${isInviteApproved ? 'بالارتباط عبر كود الدعوة ' + matchedInvitation.code : 'بإرسال طلب ارتباط بحسابك'}.`,
            relatedId: connRecord.id
          });
        }

        resetTemporaryAccountState();
        AppState.currentUser = this.sanitizeUser(newUser);
        AppState.currentPage = role === 'teacher' ? 'teacher-overview' : 'student-dashboard';
        AppState.generatedStudentCode = generateUniqueCode('STU');
        AppState.generatedTeacherCode = generateUniqueCode('TCH');
        StorageService.saveData(STORAGE_KEYS.SESSION, {
          userId: newUser.id,
          currentPage: AppState.currentPage,
          loggedInAt: nowIso
        });
        EduSyncEngine.setupSubscriptionsForCurrentUser();
        if (role === 'student' && targetTeacherForConnection) {
          const savedConn = StorageService.readData(STORAGE_KEYS.CONNECTIONS, []).find(
            c => c && c.studentId === newUser.id && c.teacherId === targetTeacherForConnection.id
          );
          if (savedConn) {
            EduSyncEngine.broadcastConnectionRequest(
              savedConn,
              newUser,
              targetTeacherForConnection.teacherCode,
              targetTeacherForConnection.id
            );
          }
        }

        return { ok: true, user: AppState.currentUser };
      },

      logout() {
        resetTemporaryAccountState();
        AppState.currentUser = null;
        AppState.currentPage = 'login';
        AppState.authMode = 'signin';
        StorageService.saveData(STORAGE_KEYS.SESSION, null);
        renderApp();
      },

      canAccessPage(role, pageId) {
        return PermissionService.canAccessPage({ role }, pageId);
      }
    };

    function setLanguage(nextLang) {

      if (!AppState.currentUser) {
        AppState.currentPage = 'login';
        renderApp();
        return;
      }
      if (!PermissionService.canAccessPage(AppState.currentUser, pageId)) {
        showToast(t('unauthorizedAccess'), 'error');
        return;

      AppState.currentPage = pageId;
      AppState.mobileSidebarOpen = false;
      AppState.activeDropdown = null;
      StorageService.saveData(STORAGE_KEYS.SESSION, {
        userId: AppState.currentUser.id,
        currentPage: AppState.currentPage,
        loggedInAt: new Date().toISOString()
      });
      renderApp();

    function extractYouTubeId(url) {
      if (!url || typeof url !== 'string') return null;
      const trimmed = url.trim();
      if (!trimmed) return null;
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/,
        /^([A-Za-z0-9_-]{11})$/
      ];
      for (const regex of patterns) {
        const match = trimmed.match(regex);
        if (match && match[1]) return match[1];
      }
      return null;
    }

    function isValidVideoUrlOrEmpty(url) {
      if (!url || !String(url).trim()) return true;
      const trimmed = String(url).trim();
      if (extractYouTubeId(trimmed)) return true;
      return /^https?:\/\/.+/i.test(trimmed);
    }

    function isLessonCompletedByStudent(studentId, lessonId) {
      const assignments = StorageService.readData(STORAGE_KEYS.LESSON_ASSIGNMENTS, []);
      if (assignments.some(a => a && a.studentId === studentId && a.lessonId === lessonId && a.status === 'completed')) {
        return true;
      }
      const settings = StorageService.readData(STORAGE_KEYS.SETTINGS, {});
      const map = settings.completedLessonsByStudent || {};
      const list = Array.isArray(map[studentId]) ? map[studentId] : [];
      return list.includes(lessonId);
    }

    function toggleLessonCompleted(studentId, lessonId) {
      const settings = StorageService.readData(STORAGE_KEYS.SETTINGS, {});
      if (!settings.completedLessonsByStudent) settings.completedLessonsByStudent = {};
      const current = Array.isArray(settings.completedLessonsByStudent[studentId])
        ? settings.completedLessonsByStudent[studentId]
        : [];
      const exists = current.includes(lessonId);
      settings.completedLessonsByStudent[studentId] = exists
        ? current.filter(id => id !== lessonId)
        : [...current, lessonId];
      StorageService.saveData(STORAGE_KEYS.SETTINGS, settings);

      const assignments = StorageService.readData(STORAGE_KEYS.LESSON_ASSIGNMENTS, []);
      assignments.forEach(a => {
        if (a && a.studentId === studentId && a.lessonId === lessonId) {
          StorageService.updateRecord(STORAGE_KEYS.LESSON_ASSIGNMENTS, a.id, {
            ...a,
            status: exists ? 'assigned' : 'completed',
            updatedAt: new Date().toISOString()
          });
        }
      });

      showToast(t('savedSuccess'), 'success');
      renderApp();
    }

    function assignLessonToStudents(lesson, teacher, studentIds) {
      if (!lesson || !teacher || !Array.isArray(studentIds) || studentIds.length === 0) return 0;
      const existingAssignments = StorageService.readData(STORAGE_KEYS.LESSON_ASSIGNMENTS, []);
      const nowIso = new Date().toISOString();
      let count = 0;

      studentIds.forEach(studentId => {
        if (!PermissionService.isStudentConnectedToTeacher(studentId, teacher.id)) return;
        const existing = existingAssignments.find(
          a => a && a.lessonId === lesson.id && a.studentId === studentId
        );
        if (existing) {
          StorageService.updateRecord(STORAGE_KEYS.LESSON_ASSIGNMENTS, existing.id, {
            ...existing,
            teacherId: teacher.id,
            updatedBy: teacher.id,
            updatedAt: nowIso
          });
        } else {
          StorageService.addRecord(STORAGE_KEYS.LESSON_ASSIGNMENTS, {
            id: `la_${Date.now()}_${Math.floor(Math.random() * 10000)}_${count}`,
            lessonId: lesson.id,
            teacherId: teacher.id,
            studentId,
            status: 'assigned',
            assignedAt: nowIso,
            createdBy: teacher.id,
            updatedBy: teacher.id,
            createdAt: nowIso,
            updatedAt: nowIso
          });
        }
        count++;
        const hasVid = Boolean(lesson.videoUrl);
        StorageService.createNotification({
          recipientId: studentId,
          titleEn: hasVid ? `New Video Lesson Assigned: ${lesson.titleEn}` : `New Lesson Assigned: ${lesson.titleEn}`,
          titleAr: hasVid ? `تم إرسال درس فيديو جديد: ${lesson.titleAr}` : `تم إرسال درس جديد: ${lesson.titleAr}`,
          messageEn: `${ teacher.nameEn } shared "${ lesson.titleEn }" with your account.`,
          messageAr: `قام ${ teacher.nameAr } بمشاركة "${ lesson.titleAr }" مع حسابك.`,
          relatedId: lesson.id
        });
        const savedAssign = StorageService.readData(STORAGE_KEYS.LESSON_ASSIGNMENTS, []).find(
          a => a && a.lessonId === lesson.id && a.studentId === studentId
        );
        EduSyncEngine.broadcastLessonAndAssignment(lesson, savedAssign, teacher, studentId);
      });

      if (count > 0) {
        StorageService.logActivity({
          actorId: teacher.id,
          actionType: 'lesson_assigned',
          relatedId: lesson.id,
          descriptionEn: `${teacher.nameEn} assigned lesson "${lesson.titleEn}" to ${count} student(s).`,
          descriptionAr: `قام ${teacher.nameAr} بإرسال درس "${lesson.titleAr}" إلى ${count} طالب.`
        });
      }
      return count;
    }

    function resolveSelectedRecipientStudentIds(teacherId, targetGrade) {
      const modeEl = document.getElementById('assignRecipientMode');
      if (!modeEl) return [];
      const mode = modeEl.value;
      const connected = StorageService.getConnectedStudentsForTeacher(teacherId, 'approved');
      if (mode === 'none') return [];
      if (mode === 'all') return connected.map(s => s.id);
      if (mode === 'grade') return connected.filter(s => Number(s.grade) === Number(targetGrade)).map(s => s.id);
      if (mode === 'selected') {
        const checked = Array.from(document.querySelectorAll('input[name="recipientStudentIds"]:checked'));
        return checked.map(cb => cb.value);
      }
      return [];
    }

    function saveLessonFromModal() {
      const user = AppState.currentUser;
      const id = document.getElementById('lessonFormId').value.trim();
      const titleEn = document.getElementById('lessonTitleEn').value.trim();
      const titleAr = document.getElementById('lessonTitleAr').value.trim();
      const grade = Number(document.getElementById('lessonGrade').value);
      const term = Number(document.getElementById('lessonTerm').value);
      const unitEn = document.getElementById('lessonUnitEn').value.trim();
      const unitAr = document.getElementById('lessonUnitAr').value.trim();
      const descriptionEn = document.getElementById('lessonDescEn').value.trim();
      const descriptionAr = document.getElementById('lessonDescAr').value.trim();
      const videoUrl = document.getElementById('lessonVideoUrl').value.trim();
      const status = document.getElementById('lessonStatus').value;
      const errBox = document.getElementById('lessonFormError');

      const finalTitleEn = titleEn || titleAr;
      const finalTitleAr = titleAr || titleEn;
      const finalDescEn = descriptionEn || descriptionAr;
      const finalDescAr = descriptionAr || descriptionEn;
      const finalUnitEn = unitEn || unitAr;
      const finalUnitAr = unitAr || unitEn;

      if (!finalTitleEn || !finalDescEn || !finalUnitEn || ![7, 8, 9].includes(grade)) {
        errBox.textContent = t('validationFailed');
        errBox.classList.remove('hidden');
        return;
      }

      if (!isValidVideoUrlOrEmpty(videoUrl)) {
        errBox.textContent = t('invalidYoutubeUrl');
        errBox.classList.remove('hidden');
        return;
      }

      const nowIso = new Date().toISOString();
      let existingRecord = null;
      if (id) {
        existingRecord = StorageService.findById(STORAGE_KEYS.LESSONS, id);
        if (!PermissionService.canModifyRecord(user, existingRecord)) {
          showToast(t('unauthorizedAccess'), 'error');
          return;
        }
      }

      const payload = {
        id: id || ('les_' + Date.now()),
        titleEn: finalTitleEn,
        titleAr: finalTitleAr,
        grade,
        term: [1, 2].includes(term) ? term : 1,
        unitEn: finalUnitEn,
        unitAr: finalUnitAr,
        descriptionEn: finalDescEn,
        descriptionAr: finalDescAr,
        videoUrl,
        status: status === 'draft' ? 'draft' : 'published',
        createdBy: existingRecord ? existingRecord.createdBy : user.id,
        updatedBy: user.id,
        createdAt: existingRecord ? existingRecord.createdAt : nowIso,
        updatedAt: nowIso
      };

      if (id) {
        StorageService.updateRecord(STORAGE_KEYS.LESSONS, id, payload);
        StorageService.logActivity({
          actorId: user.id,
          actionType: 'lesson_updated',
          relatedId: payload.id,
          descriptionEn: `${user.nameEn} updated lesson "${payload.titleEn}".`,
          descriptionAr: `قام ${user.nameAr} بتحديث درس "${payload.titleAr}".`
        });
        // Notify already-assigned students of update
        const assignedRecords = StorageService.readData(STORAGE_KEYS.LESSON_ASSIGNMENTS, []).filter(
          a => a && a.lessonId === payload.id
        );
        assignedRecords.forEach(a => {
          StorageService.createNotification({
            recipientId: a.studentId,
            titleEn: `Lesson Updated: ${payload.titleEn}`,
            titleAr: `تحديث في الدرس: ${payload.titleAr}`,
            messageEn: `${user.nameEn} updated the study material for "${payload.titleEn}".`,
            messageAr: `قام ${user.nameAr} بتحديث محتوى درس "${payload.titleAr}".`,
            relatedId: payload.id
          });
        });
        EduSyncEngine.broadcastLessonUpdate(payload, user);
      } else {
        StorageService.addRecord(STORAGE_KEYS.LESSONS, payload);
        StorageService.logActivity({
          actorId: user.id,
          actionType: 'lesson_created',
          relatedId: payload.id,
          descriptionEn: `${user.nameEn} created lesson "${payload.titleEn}".`,
          descriptionAr: `قام ${user.nameAr} بإنشاء درس "${payload.titleAr}".`
        });
      }

      const recipientIds = resolveSelectedRecipientStudentIds(user.id, payload.grade);
      if (recipientIds.length > 0) {
        assignLessonToStudents(payload, user, recipientIds);
      }

      closeModal();
      showToast(t('savedSuccess'), 'success');
      renderApp();
    }

    /* =========================================================================
       10. QUIZ MANAGEMENT, QUESTIONS EDITOR & QUIZ ASSIGNMENTS
       ========================================================================= */
    function calculateQuizTotalPoints(quiz) {
      if (!quiz || !Array.isArray(quiz.questions)) return 0;
      return quiz.questions.reduce((sum, q) => sum + (Number(q.points) || 1), 0);
    }

    function assignQuizToStudents(quiz, teacher, studentIds, dueDate = '') {
      if (!quiz || !teacher || !Array.isArray(studentIds) || studentIds.length === 0) return 0;
      const existingAssignments = StorageService.readData(STORAGE_KEYS.QUIZ_ASSIGNMENTS, []);
      const nowIso = new Date().toISOString();
      let count = 0;

      studentIds.forEach(studentId => {
        if (!PermissionService.isStudentConnectedToTeacher(studentId, teacher.id)) return;
        const existing = existingAssignments.find(
          a => a && a.quizId === quiz.id && a.studentId === studentId
        );
        if (existing) {
          StorageService.updateRecord(STORAGE_KEYS.QUIZ_ASSIGNMENTS, existing.id, {
            ...existing,
            dueDate: dueDate || existing.dueDate || '',
            updatedBy: teacher.id,
            updatedAt: nowIso
          });
        } else {
          StorageService.addRecord(STORAGE_KEYS.QUIZ_ASSIGNMENTS, {
            id: `qa_${Date.now()}_${Math.floor(Math.random() * 10000)}_${count}`,
            quizId: quiz.id,
            teacherId: teacher.id,
            studentId,
            assignedAt: nowIso,
            dueDate: dueDate || '',
            status: 'assigned',
            createdBy: teacher.id,
            updatedBy: teacher.id,
            createdAt: nowIso,
            updatedAt: nowIso
          });
        }
        count++;
        StorageService.createNotification({
          recipientId: studentId,
          titleEn: `New Quiz Assigned: ${quiz.titleEn}`,
          titleAr: `تم إرسال اختبار جديد: ${quiz.titleAr}`,
          messageEn: `${teacher.nameEn} assigned "${quiz.titleEn}" to you${dueDate ? ' (Due: ' + dueDate + ')' : ''}.`,
          messageAr: `قام ${teacher.nameAr} بتعيين "${quiz.titleAr}" لك${dueDate ? ' (الموعد: ' + dueDate + ')' : ''}.`,
          relatedId: quiz.id
        });
        const savedQA = StorageService.readData(STORAGE_KEYS.QUIZ_ASSIGNMENTS, []).find(
          a => a && a.quizId === quiz.id && a.studentId === studentId
        );
        EduSyncEngine.broadcastQuizAndAssignment(quiz, savedQA, teacher, studentId);
      });

      if (count > 0) {
        StorageService.logActivity({
          actorId: teacher.id,
          actionType: 'quiz_assigned',
          relatedId: quiz.id,
          descriptionEn: `${teacher.nameEn} assigned quiz "${quiz.titleEn}" to ${count} student(s).`,
          descriptionAr: `قام ${teacher.nameAr} بإرسال اختبار "${quiz.titleAr}" إلى ${count} طالب.`
        });
      }
      return count;
    }

    function renderTeacherQuizzes() {
      const user = AppState.currentUser;
      const quizzes = StorageService.filterByOwner(STORAGE_KEYS.QUIZZES, user.id);
      const lessons = StorageService.filterByOwner(STORAGE_KEYS.LESSONS, user.id);
      const quizAssignments = StorageService.readData(STORAGE_KEYS.QUIZ_ASSIGNMENTS, []);
